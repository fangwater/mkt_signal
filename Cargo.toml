[workspace]
members = [
    ".",
    "crates/account_common",
    "crates/cme_tas_replay",
    "crates/usstock_replay",
    "crates/account_monitor_common",
    "crates/depth_pub",
    "crates/factor_engine",
    "crates/inpos_engine",
    "crates/ipc_common",
    "crates/mkt_model_runtime",
    "crates/mkt_parsers",
    "crates/notification_server",
    "crates/order_common",
    "crates/period_pbs",
    "crates/spread_pbs_btc_inc_raw",
