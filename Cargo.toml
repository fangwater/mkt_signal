[dependencies]
account_common = { path = "crates/account_common" }
account_monitor_common = { path = "crates/account_monitor_common" }
persist_common = { path = "crates/persist_common" }
quote_plan = { path = "crates/quote_plan" }
trade_signal = { path = "crates/trade_signal" }
trade_engine = { path = "crates/trade_engine" }
order_common = { path = "crates/order_common" }
signal_common = { path = "crates/signal_common" }
runtime_common = { path = "crates/runtime_common" }
symbol_utils = { path = "crates/symbol_utils" }
ipc_common = { path = "crates/ipc_common" }
depth_pub_common = { package = "depth_pub", path = "crates/depth_pub" }
factor_engine = { path = "crates/factor_engine" }
queue_position_engine = { path = "crates/inpos_engine" }
mkt_parsers = { path = "crates/mkt_parsers" }
rolling_common = { path = "crates/rolling_common" }
viz_common = { path = "crates/viz_common" }
local-ip-address = "0.6"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
url = "2.4"
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
futures = "0.3"
bytes = { version = "1.0", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
iceoryx2 = "0.8.1"
uuid = { version = "1.17.0", features = ["v4"] }
sonic-rs = "0.5.1"
tokio-util = "0.7.15"
reqwest = { version = "0.12.19", features = ["json", "blocking"] }
prettytable = "0.10.0"
comfy-table = "=7.1.1"
native-tls = "0.2"
tokio-native-tls = "0.3"
once_cell = "1.19"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"
lazy_static = "1.4"
bincode = "1.3"
toml = "0.8"
flate2 = "1.0"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
urlencoding = "2.1"
axum = { version = "0.7", features = ["ws"] }
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
tokio-stream = "0.1"
crc32fast = "1.4"
csv = "1.3"
tar = "0.4"
tower = "0.4"
tower-http = { version = "0.4", features = ["cors"] }
dashmap = "5.5"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rtrb = "0.3.4"
libc = "0.2"
zmq = "0.10"
mkt_model_runtime = { path = "crates/mkt_model_runtime", optional = true }
indexmap = "2"
rayon = "1.10"
arc-swap = "1.7"


[features]
default = []
model-ort = ["dep:mkt_model_runtime"]

[dev-dependencies]
signal_common = { path = "crates/signal_common", features = ["test-utils"] }

[profile.release]
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 4
