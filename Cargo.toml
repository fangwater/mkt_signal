[workspace]
members = [
    ".",
    "crates/account_common",
    "crates/account_monitor_common",
    "crates/depth_pub",
    "crates/factor_engine",
    "crates/inpos_engine",
    "crates/ipc_common",
    "crates/mkt_model_runtime",
    "crates/mkt_parsers",
    "crates/order_common",
    "crates/period_pbs",
    "crates/spread_pbs_btc_inc_raw",
    "crates/persist_manager",
    "crates/persist_common",
    "crates/quote_plan",
    "crates/rolling_common",
    "crates/runtime_common",
    "crates/signal_common",
    "crates/symbol_utils",
    "crates/trade_engine",
    "crates/trade_signal",
    "crates/viz_common",
    "crates/viz_server",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
ahash = "0.8.12"
serde_json = "1.0"

[package]
name = "mkt_signal"
version = "0.1.0"
edition = "2021"
autobins = false 

[lib] 
name = "mkt_signal" 
path = "src/lib.rs" 

