# Render with scripts/render_cta_factor_config_nginx.py before installation.
location = /cta/cta-prep-binance-futures/config {
    return 303 /cta/cta-prep-binance-futures/config/;
}
location /cta/cta-prep-binance-futures/config/ {
    # Use the account workspace's Manager session. Writes still require an
    # explicit same-origin header, including requests without Sec-Fetch-Site.
    set $cta_config_expected_origin "$scheme://$http_host";
    set $cta_config_request_origin $http_origin;
    if ($request_method ~ ^(GET|HEAD)$) {
        set $cta_config_request_origin $cta_config_expected_origin;
    }
    if ($cta_config_request_origin != $cta_config_expected_origin) {
        return 403;
    }
    auth_request /manager-auth/cta-factor-config;
    # Manager's existing verifier returns status only. Keep a truthful auth
    # source marker and the audit journal's hashed session; never trust an
    # actor supplied by the browser or put its session token in this header.
    proxy_set_header X-Parameter-Actor "manager_session";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:19220/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store";
}
location = /manager-auth/cta-factor-config {
    internal;
    proxy_pass http://127.0.0.1:18201/api/auth/verify;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CTA-Source-ID "binance_exec_rx01,binance_exec_rx03,okex_exec_trade01,binance_exec_spread01";
    proxy_set_header X-CTA-Access configure;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

# Delist navigation uses its existing login, independently of Manager pages.
location = /delist/cta/config { return 303 /delist/cta/config/; }
location ^~ /delist/cta/config/ {
    set $delist_cta_expected_origin "$scheme://$http_host";
    set $delist_cta_request_origin $http_origin;
    set $delist_cta_original_method $request_method;
    if ($request_method ~ ^(GET|HEAD)$) {
        set $delist_cta_request_origin $delist_cta_expected_origin;
    }
    if ($delist_cta_request_origin != $delist_cta_expected_origin) {
        return 403;
    }
    auth_request /delist-auth/cta-factor-config;
    auth_request_set $delist_cta_actor $upstream_http_x_parameter_actor;
    proxy_set_header X-Parameter-Actor $delist_cta_actor;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:19220/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}
location = /delist-auth/cta-factor-config {
    internal;
    proxy_pass http://127.0.0.1:8787/auth/verify-login;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Original-Method $delist_cta_original_method;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}
# Retire the old editable configuration locations.
location = /cta/binance-cta-perp-rx01/config { return 410; }
location ^~ /cta/binance-cta-perp-rx01/config/ { return 410; }
location = /cta/binance-cta-perp-rx03/config { return 410; }
location ^~ /cta/binance-cta-perp-rx03/config/ { return 410; }
location = /cta/binance-cta-perp-rx04/config { return 410; }
location ^~ /cta/binance-cta-perp-rx04/config/ { return 410; }

# Spread uses the same editor and permission boundary, selecting its own catalog.
location = /cta/cta-factor-spread/config { return 303 "/cta/cta-prep-binance-futures/config/?worker=cta-factor-spread"; }
location /cta/cta-factor-spread/config/ { return 303 "/cta/cta-prep-binance-futures/config/?worker=cta-factor-spread"; }
location = /cta/okex-binance-cta-spread-rx01/config { return 410; }
location ^~ /cta/okex-binance-cta-spread-rx01/config/ { return 410; }
location = /cta/binance-cta-spread-rx01/config { return 410; }
location ^~ /cta/binance-cta-spread-rx01/config/ { return 410; }
