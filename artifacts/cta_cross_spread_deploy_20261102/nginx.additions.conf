location /exec_okex01/config/ {
    auth_request /manager-auth/exec_okex01;
    proxy_pass http://127.0.0.1:18169/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 15s;
    proxy_buffering off;
}
location = /exec_okex01 { return 301 /exec_okex01/; }
location /exec_okex01/ {
    auth_request /manager-auth/exec_okex01;
    proxy_pass http://127.0.0.1:10049/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
    proxy_buffering off;
}
location = /manager-auth/exec_okex01 {
    internal;
    proxy_pass http://127.0.0.1:18201/api/auth/verify;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CTA-Source-ID okex_exec_trade01;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

