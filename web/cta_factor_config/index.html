<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTA 配置中心</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1221;--panel:#111a33;--border:#223259;--muted:#94a3b8;--text:#e4ecff;--accent:#38bdf8;--accent-2:#2563eb;--danger:#ef4444;--ok:#34d399}
    *{box-sizing:border-box}[hidden]{display:none!important}
    body{margin:0;font-family:"Segoe UI","PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text)}
    header{padding:18px 20px;background:linear-gradient(180deg,#0f1830,#0b1221);border-bottom:1px solid var(--border)}
    h1{margin:0 0 12px;font-size:20px;font-weight:650}main{padding:20px;max-width:1440px;margin:auto}
    .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.field{display:flex;flex-direction:column;gap:6px;min-width:180px}
    label{font-size:12px;color:var(--muted)}input,select,button,textarea{padding:8px 10px;border-radius:8px;border:1px solid #2f4066;background:#0f1c3b;color:var(--text);font:13px "Segoe UI","PingFang SC","Helvetica Neue",sans-serif}
    button{cursor:pointer;border-color:var(--accent-2);background:linear-gradient(90deg,var(--accent-2),var(--accent));color:white;font-weight:650}
    button.secondary{background:#16213c;border-color:#31446d;color:#cbd5f5}button.ghost{background:transparent;border-color:#2f4066;color:#cbd5f5}button:disabled{opacity:.6;cursor:not-allowed}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 10px 28px rgba(0,0,0,.35);margin-bottom:18px}
    .section-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.section-header h2{margin:0;font-size:16px}.actions{display:flex;flex-wrap:wrap;gap:8px}
    .subnav{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}.subnav a,.subnav button{color:#cbd5f5;text-decoration:none;padding:6px 14px;border:1px solid #26375b;border-radius:999px;font-size:12px;background:transparent;font-weight:400}.subnav button[aria-selected=true]{border-color:var(--accent);color:var(--accent);background:#132b49}.subnav small{margin-left:8px;color:var(--muted)}
    .kv-table{display:grid;grid-template-columns:220px minmax(180px,1fr) 1.6fr;gap:8px;align-items:center}.kv-key{padding:8px 10px;background:#0c142b;border:1px solid #1b294c;border-radius:6px;font-size:12px}.kv-input input,.kv-input select{width:100%}.kv-desc{font-size:12px;color:var(--muted);padding:8px 4px}
    .hint,.badge{color:var(--muted);font-size:12px;line-height:1.5}.badge{font-weight:400;margin-left:8px}.status{font-size:12px;color:var(--muted);min-height:18px;margin:10px 0;white-space:pre-wrap;line-height:1.6}.status.ok{color:var(--ok)}.status.err{color:var(--danger)}
    textarea{display:block;width:100%;min-height:420px;resize:vertical;font:13px/1.65 Menlo,Consolas,monospace;tab-size:2;margin-top:12px}
    #dirty{align-self:center;color:var(--muted);font-size:12px}
    @media(max-width:960px){.kv-table{grid-template-columns:1fr}.kv-desc{padding:0 4px 10px}header,main{padding-left:12px;padding-right:12px}}
    @media(max-width:480px){.field{min-width:0;flex:1 1 130px}.toolbar>.actions{width:100%}.section-header{align-items:flex-start;flex-wrap:wrap}textarea{min-height:420px;font-size:12px}}
  </style>
</head>
<body>
<header>
  <h1>CTA 配置中心</h1>
  <div class="toolbar">
    <div class="field"><label for="strategy-type">策略类型</label><select id="strategy-type"><option value="cta-prep-binance-futures">Prep</option><option value="cta-factor-spread">Spread</option></select></div>
    <div class="field"><label for="strategy-group">策略组</label><select id="strategy-group"></select></div>
    <div class="actions"><button id="reload" class="ghost" type="button">读取</button><button id="save" type="button">保存当前频段</button><span id="dirty"></span></div>
  </div>
</header>
<main aria-busy="true">
  <nav class="subnav" aria-label="页面导航"><a href="/delist/">返回 Delist</a><a href="/manager/">CTA Manager ↗</a></nav>
  <div id="frequency-tabs" class="subnav" role="tablist" aria-label="配置频段"></div>
  <div id="message" class="status" role="status" aria-live="polite"></div>
  <section id="strategy-settings" class="panel">
    <div class="section-header"><h2>策略参数 <span id="current-frequency" class="badge"></span></h2></div>
    <p class="hint">开关、金额和开平仓阈值分别保存到当前频段。各因子沿用独立开平仓规则。</p>
    <div class="kv-table">
      <label for="enabled" class="kv-key">策略开关</label><div class="kv-input"><select id="enabled"><option value="false">关闭</option><option value="true">启用</option></select></div><div class="kv-desc">只控制当前策略组的当前频段。</div>
      <label for="max-pos" class="kv-key">单份金额（USDT）</label><div class="kv-input"><input id="max-pos" type="number" min="0" step="any"></div><div class="kv-desc">每条因子规则的单份金额，修改后用于后续新开仓。</div>
      <label for="entry-long" class="kv-key">多头开仓阈值</label><div class="kv-input"><input id="entry-long" type="number" min="-1" max="1" step="any"></div><div class="kv-desc">因子值高于此阈值时开多。</div>
      <label for="entry-short" class="kv-key">空头开仓阈值</label><div class="kv-input"><input id="entry-short" type="number" min="-1" max="1" step="any"></div><div class="kv-desc">因子值低于此阈值时开空。</div>
      <label for="exit-long" class="kv-key">多头平仓阈值</label><div class="kv-input"><input id="exit-long" type="number" min="-1" max="1" step="any"></div><div class="kv-desc">多头因子值低于此阈值时退出。</div>
      <label for="exit-short" class="kv-key">空头平仓阈值</label><div class="kv-input"><input id="exit-short" type="number" min="-1" max="1" step="any"></div><div class="kv-desc">空头因子值高于此阈值时退出。</div>
    </div>
    <div id="spread-settings" class="kv-table" style="margin-top:8px" hidden>
      <label for="spread-long" class="kv-key">多头价差分位上限</label><div class="kv-input"><input id="spread-long" type="number" min="0" max="1" step="any"></div><div class="kv-desc">前一分钟价差分位低于此值时允许开多。</div>
      <label for="spread-short" class="kv-key">空头价差分位下限</label><div class="kv-input"><input id="spread-short" type="number" min="0" max="1" step="any"></div><div class="kv-desc">前一分钟价差分位高于此值时允许开空。</div>
    </div>
  </section>
  <section class="panel">
    <div class="section-header"><h2>因子配置 <span id="factor-count" class="badge"></span></h2><div class="actions"><button id="format" class="ghost" type="button">格式化 JSON</button><button id="validate" class="secondary" type="button">校验 JSON</button></div></div>
    <p id="factor-hint" class="hint"></p>
    <textarea id="factor-json" aria-label="因子配置 JSON" spellcheck="false"></textarea>
  </section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),clone=value=>JSON.parse(JSON.stringify(value));
const prepIntervals=['1min','5min','15min'];
let catalog=null,draft=null,dirty=false,busy=true,selectedWorker=new URL(location.href).searchParams.get('worker')||'cta-prep-binance-futures';
function message(text,error=false){$('message').textContent=text;$('message').className='status '+(error?'err':'ok');}
function changed(){dirty=true;$('dirty').textContent='有未保存修改';}
function setBusy(value){busy=value;document.querySelector('main').setAttribute('aria-busy',String(value));for(const el of document.querySelectorAll('input,select,button,textarea'))el.disabled=value;if(!value){for(const button of $('frequency-tabs').children)button.disabled=!button.dataset.name;$('save').disabled=!draft;}}
async function api(path,options={}){
  const url=new URL('api/'+path,location.href.split('#')[0]);url.searchParams.set('worker',selectedWorker);
  const response=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})},credentials:'same-origin',cache:'no-store'});
  const raw=await response.text();let result;try{result=JSON.parse(raw);}catch{throw Error('读取失败，请检查登录状态');}if(!response.ok)throw Error(result.error||result.message||raw);return result;
}
function factorRows(doc){
  return doc.factor_rules.map(row=>({'标的':row['标的'].replace(/USDT$/i,''),nq:row.nq,'符号':row['符号'],'因子':row['因子']}));
}
function parseRules(){
  let rows;try{rows=JSON.parse($('factor-json').value);}catch(error){throw Error('JSON 格式错误：'+error.message);}
  if(!Array.isArray(rows)||!rows.length)throw Error('因子配置必须是非空 JSON 数组');
  const fields=['标的','nq','符号','因子'],result=[],seen=new Set();
  for(const [index,row] of rows.entries()){
    const label='第 '+(index+1)+' 项：';
    if(!row||typeof row!=='object'||Array.isArray(row)||Object.keys(row).length!==fields.length||fields.some(key=>!Object.hasOwn(row,key)))throw Error(label+'只接受「标的、nq、符号、因子」四个字段，频率在页面上统一选择');
    if(typeof row.nq!=='string'||!row.nq.trim())throw Error(label+'nq 请填写分位字符串或「关闭」');
    if(typeof row['因子']!=='string'||!row['因子'].trim())throw Error(label+'请填写因子名称');
    if(typeof row['符号']!=='number'||!Number.isFinite(row['符号']))throw Error(label+'符号必须是有效数字');
    if(typeof row['标的']!=='string'||!row['标的'].trim())throw Error(label+'标的必须是币种名称字符串，例如 "BTC"');
    const base=row['标的'].trim().toUpperCase().replace(/USDT$/,'');
    if(!/^[A-Z0-9]{1,28}$/.test(base))throw Error(label+'标的名称无效：'+row['标的']);
    const next={'标的':base+'USDT',nq:row.nq.trim(),'符号':row['符号'],'因子':row['因子'].trim()},key=JSON.stringify([next['标的'],next.nq,next['符号'],next['因子'].toLowerCase()]);
    if(seen.has(key))continue;seen.add(key);
    if(draft.reference_venue&&next['因子'].toLowerCase()!=='spread')next.venue=draft.reference_venue;
    result.push(next);
  }
  return result;
}
function number(id){const text=$(id).value;if(!text.trim()||!Number.isFinite(Number(text)))throw Error('请填写有效参数：'+$(id).closest('.kv-input').previousElementSibling.textContent);return Number(text);}
function collect(){
  if(!draft)throw Error('请先选择策略组和频段');
  const doc=clone(draft),key=row=>JSON.stringify([row['标的'],row.nq,row['符号'],row['因子'].toLowerCase(),row.venue||doc.venue,row.interval||doc.interval,row['因子'].toLowerCase()==='spread'?(row.reference_venue||doc.reference_venue):null]);
  const pending=new Map(parseRules().map(row=>[key(row),row]));
  // Keep unchanged rows in their original order, with their existing market scope.
  doc.factor_rules=doc.factor_rules.filter(row=>{const id=key(row);if(!pending.has(id))return false;pending.delete(id);return true;});
  doc.factor_rules.push(...pending.values());
  if(doc.signal){
    doc.signal.enabled=$('enabled').value==='true';doc.signal.max_pos_u=number('max-pos');
    doc.signal.entry.factor_long_quantile=number('entry-long');doc.signal.entry.factor_short_quantile=number('entry-short');
    doc.signal.execution.factor_exit_quantile_long=number('exit-long');doc.signal.execution.factor_exit_quantile_short=number('exit-short');
    if(doc.reference_venue){doc.signal.spread={long_quantile:number('spread-long'),short_quantile:number('spread-short')};}
  }
  return doc;
}
function updateCount(rows){$('factor-count').textContent=new Set(rows.map(row=>row['标的'])).size+' 个标的 · '+rows.length+' 条规则';}
function show(doc){
  draft=clone(doc);dirty=false;$('dirty').textContent='';$('strategy-group').value=doc.strategy_group;$('current-frequency').textContent=doc.interval;
  const signal=doc.signal;$('strategy-settings').hidden=!signal;
  if(signal){$('enabled').value=String(signal.enabled);$('max-pos').value=signal.max_pos_u;$('entry-long').value=signal.entry.factor_long_quantile;$('entry-short').value=signal.entry.factor_short_quantile;$('exit-long').value=signal.execution.factor_exit_quantile_long;$('exit-short').value=signal.execution.factor_exit_quantile_short;$('spread-long').value=signal.spread?.long_quantile??.3;$('spread-short').value=signal.spread?.short_quantile??.7;}
  $('spread-settings').hidden=!doc.reference_venue;$('factor-json').value=JSON.stringify(factorRows(doc),null,2);updateCount(doc.factor_rules);
  $('factor-hint').textContent='每项只填「标的、nq、符号、因子」，标的为字符串。频率统一使用上方选择的 '+doc.interval+'。nq 填「0.50」「0.2/0.8」或「关闭」。';
  renderTabs();const url=new URL(location.href);url.searchParams.set('worker',selectedWorker);url.hash=doc.name;history.replaceState(null,'',url);
}
function renderTabs(){
  $('frequency-tabs').replaceChildren();
  const group=$('strategy-group').value,intervals=selectedWorker==='cta-factor-spread'?['1min']:prepIntervals;
  for(const interval of intervals){
    const doc=Object.values(catalog.plan.combinations).find(c=>c.strategy_group===group&&c.interval===interval),button=document.createElement('button');
    button.type='button';button.setAttribute('role','tab');button.setAttribute('aria-selected',String(draft?.name===doc?.name));button.dataset.interval=interval;button.dataset.name=doc?.name||'';button.disabled=busy||!doc;
    button.append(document.createTextNode(interval));const badge=document.createElement('small');badge.textContent=doc?(doc.signal?.enabled?'已启用':'已关闭'):'未配置';button.append(badge);
    button.onclick=()=>{if(!doc||busy)return;if(dirty&&!confirm('放弃未保存修改，切换频段？'))return;show(doc);message('');};$('frequency-tabs').append(button);
  }
}
function renderCatalog(preferred){
  selectedWorker=catalog.worker;$('strategy-type').replaceChildren();for(const worker of catalog.workers||[catalog.worker])$('strategy-type').append(new Option(worker==='cta-factor-spread'?'Spread':'Prep',worker));$('strategy-type').value=selectedWorker;
  const groups=[...new Set(Object.values(catalog.plan.combinations).map(doc=>doc.strategy_group))].sort();$('strategy-group').replaceChildren();for(const group of groups)$('strategy-group').append(new Option(group,group));
  const doc=catalog.plan.combinations[preferred]||Object.values(catalog.plan.combinations).find(doc=>doc.interval==='1min')||Object.values(catalog.plan.combinations)[0];
  if(doc)show(doc);else{draft=null;$('factor-json').value='[]';$('frequency-tabs').replaceChildren();$('strategy-settings').hidden=true;message('尚无该策略的频段配置');}
}
async function load(){
  if(busy&&catalog)return;if(dirty&&!confirm('放弃未保存修改，重新读取？'))return;
  setBusy(true);try{catalog=await api('config');renderCatalog(decodeURIComponent(location.hash.slice(1)));message('读取完成');}catch(error){if(catalog){selectedWorker=catalog.worker;$('strategy-type').value=selectedWorker;}message(error.message,true);}finally{setBusy(false);}
}
async function action(save){
  if(busy||!draft)return;setBusy(true);
  try{const combination=collect(),result=await api(save?'combinations':'preview',{method:'POST',body:JSON.stringify({worker:selectedWorker,combination,expected_revision:catalog.revision})});
    if(save){catalog=result;renderCatalog(combination.name);message('已保存 '+combination.strategy_group+' · '+combination.interval);}
    else{updateCount(combination.factor_rules);message('JSON 校验通过：'+combination.factor_rules.length+' 条规则');}
  }catch(error){message(error.message,true);}finally{setBusy(false);}
}
$('strategy-type').onchange=async()=>{if(dirty&&!confirm('放弃未保存修改，切换策略类型？')){$('strategy-type').value=selectedWorker;return;}selectedWorker=$('strategy-type').value;dirty=false;const url=new URL(location.href);url.hash='';history.replaceState(null,'',url);await load();};
$('strategy-group').onchange=()=>{if(dirty&&!confirm('放弃未保存修改，切换策略组？')){$('strategy-group').value=draft.strategy_group;return;}const docs=Object.values(catalog.plan.combinations).filter(doc=>doc.strategy_group===$('strategy-group').value);const next=docs.find(doc=>doc.interval===draft?.interval)||docs.find(doc=>doc.interval==='1min')||docs[0];if(next)show(next);message('');};
$('reload').onclick=load;$('save').onclick=()=>action(true);$('validate').onclick=()=>action(false);
$('format').onclick=()=>{if(!draft||busy)return;try{const doc=clone(draft);doc.factor_rules=parseRules();$('factor-json').value=JSON.stringify(factorRows(doc),null,2);updateCount(doc.factor_rules);changed();message('JSON 已格式化，尚未保存');}catch(error){message(error.message,true);}};
for(const id of ['factor-json','enabled','max-pos','entry-long','entry-short','exit-long','exit-short','spread-long','spread-short'])$(id).addEventListener('input',changed);
window.addEventListener('hashchange',()=>{if(!catalog||busy)return;const requested=decodeURIComponent(location.hash.slice(1)),next=catalog.plan.combinations[requested];if(!next||next.name===draft?.name)return;if(dirty&&!confirm('放弃未保存修改，切换频段？')){const url=new URL(location.href);url.hash=draft.name;history.replaceState(null,'',url);return;}show(next);message('');});
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
load();
</script>
</body>
</html>
