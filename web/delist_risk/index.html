<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>下架与敞口风险</title>
    <style>
      :root {
        --ink: #1f2933;
        --muted: #637083;
        --quiet: #8a94a3;
        --line: #dfe4ea;
        --line-strong: #cbd3dc;
        --canvas: #f7f8fa;
        --surface: #ffffff;
        --surface-hover: #fafbfd;
        --good: #17714e;
        --good-soft: #e8f5ee;
        --warn: #9a6500;
        --warn-soft: #fff4d9;
        --danger: #b33a35;
        --danger-soft: #fff0ef;
      }
      * { box-sizing: border-box; }
      html { background: var(--canvas); }
      body {
        min-width: 320px;
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        font-size: 14px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      button { font: inherit; }
      code, .symbol { font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace; }

      .topbar { height: 58px; border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, 0.96); }
      .topbar__inner, .page { width: min(1280px, calc(100% - 48px)); margin: 0 auto; }
      .topbar__inner { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
      .brand { display: flex; align-items: baseline; gap: 11px; min-width: 0; }
      .brand__name { color: var(--ink); font-size: 16px; font-weight: 650; line-height: 1; }
      .brand__context { padding-left: 11px; border-left: 1px solid var(--line); color: var(--muted); font-size: 12px; white-space: nowrap; }
      .system-state { display: inline-flex; align-items: center; gap: 8px; min-width: 0; margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
      .state-dot { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: var(--quiet); }
      .state-dot--ok { background: #26845e; box-shadow: 0 0 0 3px #e8f5ee; }
      .state-dot--risk { background: #c18310; box-shadow: 0 0 0 3px #fff4d9; }
      .state-dot--error { background: #c44540; box-shadow: 0 0 0 3px #fff0ef; }
      .refresh { min-height: 30px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface); color: var(--muted); cursor: pointer; }
      .refresh:hover { border-color: #aeb8c4; color: var(--ink); }

      .page { padding: 30px 0 56px; }
      .overview { display: flex; align-items: end; justify-content: space-between; gap: 24px; }
      h1 { margin: 0; color: var(--ink); font-size: 23px; font-weight: 650; line-height: 1.2; }
      .as-of { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
      .filters { display: flex; align-items: center; gap: 3px; padding: 3px; overflow-x: auto; border: 1px solid var(--line); border-radius: 5px; background: #f1f3f5; }
      .filters button { min-height: 30px; padding: 0 10px; border: 0; border-radius: 3px; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; white-space: nowrap; }
      .filters button:hover { color: var(--ink); }
      .filters button.is-active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(31, 41, 51, 0.1); }

      .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 24px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, 0.52); }
      .metric { min-height: 68px; padding: 13px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .metric + .metric { border-left: 1px solid var(--line); }
      .metric span { color: var(--muted); font-size: 12px; }
      .metric strong { color: var(--ink); font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
      .metric--risk strong { color: var(--danger); }
      .metric--error strong { color: var(--warn); }

      .error-state { margin-top: 20px; padding: 13px 15px; border: 1px solid #edc9c6; border-left: 3px solid var(--danger); background: var(--danger-soft); color: #84312d; font-size: 13px; }
      .error-state strong { display: block; margin-bottom: 2px; }
      .exchange-list { margin-top: 20px; }
      .exchange { border-bottom: 1px solid var(--line); background: var(--surface); }
      .exchange:first-child { border-top: 1px solid var(--line); }
      .exchange__header { min-height: 68px; padding: 12px 18px; display: grid; grid-template-columns: minmax(180px, 1.2fr) minmax(170px, 1fr) auto; align-items: center; gap: 18px; }
      .exchange__identity { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .exchange__name { font-size: 15px; font-weight: 650; }
      .exchange__site { color: var(--quiet); font-size: 11px; }
      .exchange__counts { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
      .exchange__counts strong { color: var(--ink); font-size: 15px; font-weight: 650; }
      .exchange__counts--risk strong { color: var(--danger); }
      .exchange__status { justify-self: end; }
      .exchange__account-heading { padding: 10px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
      .exchange__body { border-top: 1px solid var(--line); }
      .announcement { margin: 0 18px 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 5px; background: #fafbfd; }
      .announcement__heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; }
      .announcement__label { color: var(--muted); font-size: 11px; font-weight: 650; }
      .announcement__meta { color: var(--quiet); font-size: 11px; font-variant-numeric: tabular-nums; }
      .announcement__title { margin: 8px 0 0; color: var(--ink); font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
      .announcement__title a { color: inherit; text-decoration: none; }
      .announcement__title a:hover { text-decoration: underline; }
      .announcement__source { margin-left: 8px; color: var(--muted); font-size: 11px; font-weight: 400; white-space: nowrap; }
      .announcement__result { margin: 10px 0 0; color: var(--muted); font-size: 12px; }
      .announcement__result--error { color: var(--danger); }
      .announcement__times { margin-top: 6px; color: var(--quiet); font-size: 11px; }
      .announcement-actions { width: 100%; margin-top: 10px; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
      .announcement-actions th { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); color: var(--quiet); font-size: 11px; font-weight: 500; text-align: left; }
      .announcement-actions td { padding: 9px 10px 9px 0; border-bottom: 1px solid #edf0f3; vertical-align: top; overflow-wrap: anywhere; }
      .announcement-actions tr:last-child td { border-bottom: 0; }
      .announcement-actions__action { color: var(--ink); font-weight: 600; }
      .announcement-actions__assets { color: var(--ink); font-size: 11px; }
      .announcement-actions__assets small { display: block; margin-top: 3px; color: var(--quiet); font: inherit; }
      .announcement-actions__note { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; font-weight: 400; }
      .announcement-actions__time { font-variant-numeric: tabular-nums; }
      .announcement-actions__status { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
      .account-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
      .account-table th { padding: 8px 18px; border-bottom: 1px solid var(--line); background: #fafbfd; color: var(--quiet); font-size: 10px; font-weight: 650; letter-spacing: 0; text-align: left; text-transform: uppercase; }
      .account-table th:last-child, .account-table td:last-child { text-align: right; }
      .account-table td { padding: 11px 18px; border-bottom: 1px solid #edf0f3; color: var(--muted); font-size: 12px; vertical-align: top; }
      .account-table tbody tr:last-child td { border-bottom: 0; }
      .account-name { color: var(--ink); font-size: 13px; font-weight: 600; }
      .account-slug { display: block; margin-top: 2px; color: var(--quiet); font-size: 10px; }
      .account-nav { display: inline-flex; align-items: center; gap: 8px; }
      .config-link { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 28px; padding: 0 9px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface); color: var(--ink); font-size: 12px; text-decoration: none; white-space: nowrap; }
      .config-link:hover { border-color: var(--muted); background: var(--surface-hover); }
      .config-link:focus-visible { outline: 2px solid var(--good); outline-offset: 2px; }
      .account-venues { color: var(--quiet); font-size: 11px; }
      .account-value { color: var(--ink); font-variant-numeric: tabular-nums; }
      .account-value--risk { color: var(--danger); font-weight: 650; }
      .hit-row td { padding-top: 0; padding-bottom: 12px; background: #fcfdfd; }
      .hit-list { display: grid; gap: 5px; }
      .hit { display: flex; align-items: baseline; gap: 8px; min-width: 0; padding: 7px 9px; border-left: 2px solid #d67b75; background: var(--danger-soft); }
      .hit .symbol { flex: 0 0 auto; color: #852d29; font-size: 11px; font-weight: 700; }
      .hit__detail { flex: 1 1 auto; min-width: 0; overflow: hidden; color: #795e5c; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
      .hit--closed { border-left-color: #4d9a76; background: var(--good-soft); }
      .hit--closed .symbol { color: var(--good); }
      .hit--closed .hit__detail { color: #49685a; }
      .flatten-state { display: inline-flex; align-items: center; gap: 7px; margin-left: auto; color: #795e5c; font-size: 11px; white-space: nowrap; }
      .flatten-state strong { color: #852d29; font-variant-numeric: tabular-nums; }
      .closed-state { display: inline-flex; align-items: center; gap: 7px; margin-left: auto; color: #49685a; font-size: 11px; white-space: nowrap; }
      .closed-state strong { color: var(--good); }
      .flatten-action { min-height: 26px; padding: 0 9px; border: 1px solid #b84b45; border-radius: 4px; background: #b33a35; color: #fff; cursor: pointer; font-size: 11px; font-weight: 650; }
      .flatten-action:hover { background: #972f2b; }
      .flatten-action:disabled { cursor: wait; opacity: 0.65; }
      .empty { padding: 42px 18px; color: var(--muted); text-align: center; }
      .chip { display: inline-flex; align-items: center; min-height: 20px; padding: 0 7px; border-radius: 3px; font-size: 10px; font-weight: 650; line-height: 1; white-space: nowrap; }
      .chip--ok { color: var(--good); background: var(--good-soft); }
      .chip--risk { color: var(--danger); background: var(--danger-soft); }
      .chip--error, .chip--uncovered { color: var(--warn); background: var(--warn-soft); }
      .exposure { margin: 22px 0; border: 1px solid var(--line); background: var(--surface); }
      .exposure__heading { padding: 16px 18px 10px; }
      .exposure h2 { margin: 0; font-size: 17px; }
      .exposure__note { margin: 6px 0; color: var(--muted); font-size: 12px; }
      .exposure__summary { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; font-size: 12px; }
      .exposure__summary strong { font-size: 16px; font-variant-numeric: tabular-nums; }
      .exposure__scroll { overflow-x: auto; }
      .exposure table { width: 100%; border-collapse: collapse; font-size: 12px; }
      .exposure th, .exposure td { padding: 10px 16px; border-top: 1px solid var(--line); text-align: right; vertical-align: top; font-variant-numeric: tabular-nums; }
      .exposure th { color: var(--muted); background: var(--surface-hover); font-weight: 500; white-space: nowrap; }
      .exposure th:first-child, .exposure td:first-child { text-align: left; }
      .exposure td small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
      .exposure .exposure__detail { padding-top: 0; border-top: 0; text-align: left; }
      .exposure details summary { color: var(--muted); cursor: pointer; }
      .exposure .exposure__issues { margin: 6px 0; color: var(--warn); overflow-wrap: anywhere; }
      .exposure .exposure__breach { color: var(--danger); }
      .exposure__detail table { min-width: 720px; margin: 10px 0; }
      @media (max-width: 760px) {
        .exposure__accounts > thead { display: none; }
        .exposure__accounts, .exposure__accounts > tbody, .exposure__accounts > tbody > tr { display: block; width: 100%; }
        .exposure__accounts > tbody > tr { padding: 10px 14px; border-top: 1px solid var(--line); }
        .exposure__accounts > tbody > tr:has(.exposure__detail) { padding-top: 0; border-top: 0; }
        .exposure__accounts > tbody > tr > td { display: block; padding: 3px 0; border: 0; text-align: left; }
        .exposure__accounts > tbody > tr > td[data-label]::before { content: attr(data-label) '：'; color: var(--muted); }
        .exposure__accounts > tbody > tr > td > small { display: inline; margin-left: 8px; }
        .exposure__heading { padding: 14px; }
      }

      @media (max-width: 760px) {
        .topbar { height: 54px; }
        .topbar__inner, .page { width: min(100% - 28px, 1280px); }
        .brand__context, #refresh { display: none; }
        .system-state { overflow: hidden; text-overflow: ellipsis; }
        .page { padding-top: 24px; }
        .overview { display: block; }
        h1 { font-size: 21px; }
        .filters { width: 100%; margin-top: 17px; }
        .metrics { grid-template-columns: 1fr 1fr; }
        .metric { min-height: 58px; padding: 10px 12px; }
        .metric:nth-child(3) { border-top: 1px solid var(--line); border-left: 0; }
        .metric:nth-child(4) { border-top: 1px solid var(--line); }
        .exchange__header { min-height: 62px; padding: 12px; grid-template-columns: minmax(100px, 1fr) auto; gap: 10px; }
        .exchange__counts { display: none; }
        .exchange__account-heading { padding: 10px 12px; }
        .announcement { margin: 0 12px 12px; padding: 12px; }
        .announcement-actions thead { display: none; }
        .announcement-actions, .announcement-actions tbody, .announcement-actions tr, .announcement-actions td { display: block; width: 100%; }
        .announcement-actions tr { padding: 10px 0; border-top: 1px solid var(--line); }
        .announcement-actions td { padding: 3px 0; border: 0; }
        .announcement-actions td[data-label]::before { content: attr(data-label) "："; color: var(--quiet); }
        .announcement-actions__assets small { display: inline; margin-left: 6px; }
        .account-table thead { display: none; }
        .account-table, .account-table tbody, .account-table tr, .account-table td { display: block; width: 100%; }
        .account-table tr { padding: 11px 12px; border-bottom: 1px solid #edf0f3; }
        .account-table td { display: inline; padding: 0; border: 0; }
        .account-table td:first-child { display: block; margin-bottom: 5px; }
        .account-table td:nth-child(2)::before { content: "策略："; color: var(--quiet); }
        .account-table td:nth-child(3)::before { content: "标的："; color: var(--quiet); }
        .account-table td:nth-child(4) { float: right; }
        .account-table td:last-child { display: block; clear: both; margin-top: 8px; text-align: left; }
        .cta-table td:nth-child(2)::before { content: "状态："; }
        .cta-table td:nth-child(4)::before { content: "风险："; color: var(--quiet); }
        .account-nav { display: flex; justify-content: flex-start; }
        .hit-row { padding-top: 0 !important; }
        .hit-row td { display: block; padding: 0; background: transparent; }
        .hit { align-items: flex-start; flex-wrap: wrap; }
        .hit__detail { white-space: normal; }
        .flatten-state { width: 100%; margin: 5px 0 0; flex-wrap: wrap; }
        .closed-state { width: 100%; margin: 5px 0 0; flex-wrap: wrap; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <div class="brand"><span class="brand__name">Risk Monitor</span><span class="brand__context">Delist coverage</span></div>
        <div class="system-state" id="system-state"><span class="state-dot"></span><span>正在读取</span></div>
        <button class="refresh" id="refresh" type="button">刷新</button>
        <button class="refresh" id="logout" type="button">退出</button>
      </div>
    </header>
    <main class="page">
      <section class="overview" aria-labelledby="page-title">
        <div><h1 id="page-title">下架与敞口风险</h1><p class="as-of" id="as-of">正在同步账户名单与公告</p></div>
        <div class="filters" id="filters" aria-label="策略类型筛选"></div>
      </section>
      <section class="metrics" id="metrics" aria-label="风险摘要"></section>
      <nav class="filters" id="cta-config-entries" aria-label="CTA 统一配置入口" style="margin:0 0 20px;gap:12px">
        <a class="config-link" href="/cta/cta-prep-binance-futures/config/?worker=cta-prep-binance-futures">CTA Prep 统一配置 ↗</a>
        <a class="config-link" href="/cta/cta-prep-binance-futures/config/?worker=cta-factor-spread">CTA Spread 统一配置 ↗</a>
      </nav>
      <div id="error"></div>
      <section class="exposure" id="exposures" aria-label="FR 敞口检查" aria-live="polite"><div class="exposure__heading"><h2>FR 敞口检查</h2><p class="exposure__note">正在读取账户持仓</p></div></section>
      <section class="exchange-list" id="cta-strategies" aria-label="CTA 组合与执行账户"></section>
      <section class="exchange-list" id="exchange-list" aria-label="交易所风险明细"></section>
    </main>
    <script>
      const FILTERS = [['all', '全部'], ['funding_rate', '资金费'], ['intra_exchange', '所内套利'], ['market_making', '做市'], ['cta', 'CTA']];
      const EXCHANGES = { binance: 'Binance', gate: 'Gate', bitget: 'Bitget', okex: 'OKX', bybit: 'Bybit' };
      const KINDS = { funding_rate: '资金费', intra_exchange: '所内套利', market_making: '做市', cta: 'CTA' };
      const TONES = { ok: '正常', risk: '需处理', error: 'Redis 未连接', uncovered: '风险源待接入' };
      let filter = 'all';
      let payload = null;
      let flattenPayload = null;
      let ctaPayload = null;
      let backupStatus = null;
      let exposurePayload = null;
      let exposureError = '';
      let flattenByKey = new Map();
      let positionStatusByKey = new Map();

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
      }
      function formatTime(ms) {
        if (!ms) return '更新时间暂不可用';
        return `更新于 ${new Intl.DateTimeFormat('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date(ms))}`;
      }
      function api(path, options = {}) {
        const base = location.pathname.endsWith('/') ? location.pathname : location.pathname.replace(/[^/]+$/, '');
        return fetch(base + path.replace(/^\//, ''), { cache: 'no-store', ...options }).then(async (response) => {
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            if (response.status === 401 && path !== 'flatten') location.replace('/delist/login');
            const error = new Error(data.error || `${path} ${response.status}`);
            error.status = response.status;
            throw error;
          }
          return data;
        });
      }
      function setSystem(tone, text) {
        document.getElementById('system-state').innerHTML = `<span class="state-dot state-dot--${tone}"></span><span>${escapeHtml(text)}</span>`;
      }
      function exposureAccounts() {
        const now = Date.now();
        const settings = exposurePayload?.settings || {};
        return (exposurePayload?.accounts || []).map(account => {
          const stale = now - Number(account.checked_ms || 0) > Number(settings.interval_secs || 10) * 3000
            || [account.snapshot_ms, account.account_ms].some(ts => ts && now - ts > Number(settings.max_age_secs || 90) * 1000);
          return stale || exposureError ? { ...account, complete: false, data_status: 'stale', risk_status: account.risk_status === 'alert' ? 'alert' : 'unknown' } : account;
        });
      }
      function updateSystem() {
        if (!payload) return;
        const summary = combinedSummary();
        const accounts = exposureAccounts();
        const alerts = accounts.filter(a => a.risk_status === 'alert').length;
        const unknown = accounts.filter(a => !a.complete).length;
        const exposureFailed = exposureError || (exposurePayload?.errors || []).length;
        const flattenErrors = (flattenPayload?.snapshot_errors || []).length;
        const dumpErrors = (flattenPayload?.dump_errors || []).length;
        const errors = summary.error || flattenErrors || dumpErrors || unknown || exposureFailed;
        const text = [alerts ? `${alerts} 个 FR 敞口超限` : '', unknown ? `${unknown} 个 FR 敞口数据不完整` : exposureFailed ? '敞口检查读取失败' : '', summary.error ? `${summary.error} 个数据源或策略状态异常` : '', flattenErrors ? `${flattenErrors} 个持仓快照异常` : '', dumpErrors ? `${dumpErrors} 个 dump 状态异常` : '', summary.risk ? `${summary.risk} 个盘子有下架风险` : ''].filter(Boolean).join(' · ');
        setSystem(errors ? 'error' : alerts || summary.risk ? 'risk' : 'ok', text || '数据已同步');
      }
      function renderExposures() {
        const root = document.getElementById('exposures');
        if (!exposurePayload) {
          root.innerHTML = `<div class="exposure__heading"><h2>FR 敞口检查</h2><p class="exposure__issues">${escapeHtml(exposureError || '正在读取账户持仓')}</p></div>`;
          return;
        }
        const opened = new Set([...root.querySelectorAll('details[open]')].map(d => d.dataset.env));
        const accounts = exposureAccounts();
        const settings = exposurePayload.settings;
        const money = value => Number.isFinite(value) ? `${(Math.abs(value) < .005 ? 0 : value).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} U` : '未知';
        const qty = value => Number.isFinite(value) ? value.toLocaleString('en-US', { maximumFractionDigits: 8 }) : '未知';
        const riskNames = { ok: '阈值内', pending: '超限观察中', alert: '持续超限', unknown: '无法确认' };
        const dataNames = { fresh: '数据正常', partial: '估值不完整', stale: '数据过期', unavailable: '读取失败' };
        const age = ms => ms ? `${Math.max(0, Math.round((Date.now() - ms) / 1000))} 秒前` : '未知';
        const issues = [...(exposurePayload.errors || []), ...(exposureError ? [`读取失败：${exposureError}`] : [])];
        root.innerHTML = `<div class="exposure__heading"><h2>FR 敞口检查</h2>

        if (!accounts.length) { root.innerHTML = '<div class="empty">当前筛选条件下没有盘子</div>'; return; }
        const groups = new Map();
        accounts.forEach((account) => { if (!groups.has(account.exchange)) groups.set(account.exchange, []); groups.get(account.exchange).push(account); });
        const score = (items) => items.reduce((sum, item) => sum + (item.risk_n || 0) * 100 + (item.tone === 'error' ? 10 : 0) + (item.unimmr_empty ? 50 : 0), 0);
        root.innerHTML = [...groups.entries()].sort(([, left], [, right]) => score(right) - score(left)).map(([exchange, group]) => exchangeBlock(exchange, group)).join('');
        root.querySelectorAll('.flatten-action').forEach((button) => button.addEventListener('click', () => executeManualFlatten(button)));
        root.querySelectorAll('.backup-action').forEach((button) => button.addEventListener('click', () => executeBackup(button)));
      }
      function renderCta() {
        const root = document.getElementById('cta-strategies');
        if (filter !== 'all' && filter !== 'cta') { root.innerHTML = ''; return; }
        if (!ctaPayload) { root.innerHTML = ''; return; }
        const managers = (ctaPayload.managers || []).map(m => `${m.site.toUpperCase()} Manager：${m.ok ? '已连接' : '读取失败'}`).join(' · ');
        const errors = [...(ctaPayload.errors || []), ...(ctaPayload.managers || []).filter(m => !m.ok).map(m => `${m.site.toUpperCase()} Manager：${m.error || '读取失败'}`)];
        const factorBlock = (ctaPayload.factor_processes || []).map(factor => {
        const factorState = !factor?.configured ? '配置不可用' : factor.stale ? '运行状态不可用或过期' : factor.warming ? '正在回放新计划' : !factor.plan_matches_config ? '计划待同步' : '状态已更新';
        const factorCombinations = (factor?.combinations || []).map(c => `<div class="account-nav"><a class="config-link" href="${escapeHtml(c.config_url)}"><code>${escapeHtml(c.name)}</code></a><span>${c.factor_count} 项因子 · ${c.symbols.length} 个标的 · ${c.position_strategies.length ? `仓位策略 ${c.position_strategies.map(escapeHtml).join('、')}` : '未配置仓位策略'}</span></div>`).join('');
        return `<div class="exchange__account-heading">${factor.name === 'cta-factor-spread' ? 'CTA Spread' : 'CTA Prep'} · <a class="config-link" href="${escapeHtml(factor.config_url)}">统一配置 ↗</a> · 合并计算 ${factor.unique_factor_count} 项 · ${escapeHtml(factorState)}</div><div class="account-nav">${factorCombinations}</div>${(factor.errors || []).map(e => `<div class="error-state">${escapeHtml(e)}</div>`).join('')}`;
        }).join('');
        const rows = (ctaPayload.strategies || []).map(s => {
          const title = s.name;
          const factorCount = s.factor_count == null ? '共享因子配置未关联' : `${s.factor_count} 项因子`;
          const status = s.stale ? '计算状态过期或仓位表未就绪' : s.enabled ? '仓位计算已启用' : '仓位计算已暂停';
          const execs = (s.accounts || []).map(a => {
            const label = `${a.alias || a.source_id} (${a.site.toUpperCase()} / ${a.source_id})`;
            const link = a.viz_url ? `<a class="config-link viz-link" href="${escapeHtml(a.viz_url)}" target="_blank" rel="noopener" referrerpolicy="same-origin">执行面板 ↗</a>` : '<span>无面板入口</span>';
            const state = a.pending ? '绑定待同步' : a.active ? '执行绑定生效' : '执行绑定未启用';
            return `<div class="account-nav"><span>${escapeHtml(label)} · ${escapeHtml(state)}</span> ${link}</div>`;
          }).join('') || `<span class="account-venues">${(ctaPayload.managers || []).some(m => !m.ok) ? '暂未发现执行账户；部分 Manager 读取失败' : '没有发现关联执行账户'}</span>`;
          const warnings = (s.errors || []).map(e => `<div class="account-value--risk">${escapeHtml(e)}</div>`).join('');
          const hits = (s.risk?.hits || []).map(hit => `<div class="hit"><span class="symbol">${escapeHtml(hit.symbol)}</span><span class="hit__detail">${escapeHtml(conclusion(hit))}</span></div>`).join('');
          const signalLink = s.risk?.viz_url ? `<a class="config-link" href="${escapeHtml(s.risk.viz_url)}" target="_blank" rel="noopener">信号面板 ↗</a>` : '';
          const configLink = s.risk?.config_url ? `<a class="config-link" href="${escapeHtml(s.risk.config_url)}" target="_blank" rel="noopener">策略配置 ↗</a>` : '';
          const backupKind = s.kind === 'spread' ? 'cta_spread' : 'cta_perp';
          const backupButton = s.backup_env ? `<button class="refresh backup-action" type="button" data-kind="${backupKind}" data-env="${escapeHtml(s.backup_env)}">立即备份</button>${backupState(backupKind, s.backup_env)}` : '';
          const riskLabel = s.risk?.tone === 'uncovered' ? '风险源待接入' : String(s.risk?.risk_n || 0);
          return `<tr data-strategy="${escapeHtml(s.slug)}"><td><span class="account-name">${escapeHtml(title)}</span><code class="account-slug">${escapeHtml(s.slug)}</code><span class="account-venues">${escapeHtml(factorCount)}</span>${signalLink} ${configLink} ${backupButton}</td><td>${escapeHtml(status)}${warnings}</td><td>${s.risk?.universe_n || 0}</td><td>${escapeHtml(riskLabel)}</td><td>${execs}</td></tr>${hits ? `<tr class="hit-row"><td colspan="5"><div class="hit-list">${hits}</div></td></tr>` : ''}`;
        }).join('');
        root.innerHTML = `<section class="exchange"><div class="exchange__header"><div class="exchange__identity"><span class="exchange__name">CTA 策略与因子</span><span class="exchange__site">${escapeHtml(managers)}</span></div></div>${factorBlock}${errors.map(e => `<div class="error-state">${escapeHtml(e)}</div>`).join('')}<div class="exchange__body"><table class="account-table cta-table"><thead><tr><th>组合仓位策略</th><th>状态</th><th>标的</th><th>风险</th><th>关联执行账户</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
        root.querySelectorAll('.backup-action').forEach((button) => button.addEventListener('click', () => executeBackup(button)));
      }
      async function executeBackup(button) {
        button.disabled = true;
        button.textContent = '备份中';
        try {
          const result = await api('backup-now', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: button.dataset.kind, env: button.dataset.env }) });
          const notes = [...(result.warnings || []), ...(result.retention_warning ? [result.retention_warning] : [])];
          window.alert(`备份已上传并校验：${result.filename}${notes.length ? `\n\n注意：\n${notes.join('\n')}` : ''}`);
        } catch (error) {
          window.alert(`备份未完成：${error.message || '未知错误'}`);
        } finally {
          button.disabled = false;
          button.textContent = '立即备份';
          await load();
        }
      }
      function render() {
        if (!payload) return;
        renderFilters();
        renderMetrics(combinedSummary());
        renderCta();
        document.getElementById('as-of').textContent = formatTime(payload.as_of_ms);
        renderList((payload.accounts || []).filter((account) => filter === 'all' || account.kind === filter));
      }
      async function load() {
        document.getElementById('error').textContent = '';
        setSystem('risk', '正在同步');
        try {
          [payload, flattenPayload, backupStatus] = await Promise.all([api('accounts'), api('flatten-candidates'), api('status').catch(() => null)]);
          ctaPayload = await api('cta-strategies').catch(error => ({ managers: [], strategies: [], errors: [`CTA 映射读取失败：${error.message || '未知错误'}`] }));
          flattenByKey = new Map((flattenPayload.items || []).map((item) => [flattenKey(item.account_slug, item.symbol), item]));
          positionStatusByKey = new Map((flattenPayload.position_statuses || []).map((item) => [flattenKey(item.account_slug, item.symbol), item]));
          updateSystem();
          render();
        } catch (error) {
          setSystem('error', '加载失败');
          document.getElementById('error').innerHTML = `<div class="error-state"><strong>账户风险加载失败</strong>${escapeHtml(error.message || '未知错误')}</div>`;
        }
      }
      async function executeManualFlatten(button) {
        const account = button.dataset.account;
        const symbol = button.dataset.symbol;
        const item = flattenByKey.get(flattenKey(account, symbol));
        if (!item) return;
        const position = Number(item.position_usdt || 0).toFixed(2);
        if (!window.confirm(`${account} ${symbol}\n当前持仓 ${position}U\n执行 flatten --symbol ${symbol} --mode clear？`)) return;
        let token = window.sessionStorage.getItem('delistFlattenToken') || '';
        if (!token) token = window.prompt('请输入人工清仓操作口令') || '';
        if (!token) return;
        window.sessionStorage.setItem('delistFlattenToken', token);
        button.disabled = true;
        button.textContent = '执行中';
        try {
          await api('flatten', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ account_slug: account, symbol }),
          });
          window.alert(`${account} ${symbol} 清仓脚本执行完成`);
        } catch (error) {
          if (error.status === 401) window.sessionStorage.removeItem('delistFlattenToken');
          window.alert(`${account} ${symbol} 清仓失败：${error.message || '未知错误'}`);
        } finally {
          await load();
        }
      }
      document.getElementById('refresh').addEventListener('click', () => { load(); loadExposures(); });
      document.getElementById('logout').addEventListener('click', async () => {
        await api('logout', { method: 'POST' });
        window.sessionStorage.removeItem('delistFlattenToken');
        location.replace('/delist/login');
      });
      load();
      loadExposures();
      window.setInterval(load, 60_000);
      window.setInterval(loadExposures, 10_000);
    </script>
  </body>
</html>
