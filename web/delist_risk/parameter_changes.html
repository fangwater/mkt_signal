<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参数变更记录</title>
<style>body{font:15px system-ui;background:#101827;color:#e8edf5;margin:2rem;max-width:1100px}a{color:#83c6ff}article{border:1px solid #42516a;border-radius:8px;margin:1rem 0;padding:1rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#b6c3d6}</style>
<a href="/delist/">← Delist</a><h1>参数变更记录</h1><p>覆盖 CTA Prep／Spread、FR、MM。显示最近 200 次实际变更；钉钉中的记录链接可查询对应完整存档。共享登录只能确认登录账号，不能确定具体操作人。</p><p id="status">读取中…</p><main id="changes"></main>
<script>
(async()=>{const status=document.querySelector('#status'),main=document.querySelector('#changes');try{const target=location.hash.match(/^#(jp|sg)-(\d+)$/);const url=target?`api/parameter-change?site=${target[1]}&id=${target[2]}`:'api/parameter-changes';const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error(response.status===401?'请先登录 Delist':'读取记录失败');const data=await response.json(),records=target?[data]:(data.changes||[]).slice().reverse();status.textContent=data.disabled?'通知服务未启用':`共 ${records.length} 条记录`;for(const entry of records){const event=entry.event,article=document.createElement('article'),title=document.createElement('h2'),detail=document.createElement('p'),pre=document.createElement('pre'),link=document.createElement('a');title.textContent=`${event.family} / ${event.environment}`;detail.textContent=`${new Date(event.time_us/1000).toISOString()} · ${entry.site} · ${event.source} · 账号 ${event.actor||'未知'} · IP ${event.source_ip||'未知'} · 会话 ${event.session_id||'未知'}`;link.href=`#${entry.site}-${event.id}`;link.textContent='本条完整存档';link.onclick=()=>location.reload();pre.textContent=JSON.stringify(event.objects,null,2);article.append(title,detail,link,pre);main.append(article);}}catch(error){status.textContent=error.message;}})();
</script></html>
