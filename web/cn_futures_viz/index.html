<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>国内期货 Exec 执行监控</title>
<style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        --bg: #0b0f14;
        --surface: #121820;
        --surface-2: #171f29;
        --line: #2a3441;
        --text: #edf2f7;
        --muted: #91a0b2;
        --green: #4ade80;
        --red: #fb7185;
        --amber: #fbbf24;
        --cyan: #38bdf8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        letter-spacing: 0;
      }
      header {
        min-height: 62px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--line);
        background: #0e141b;
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      h1 { margin: 0; font-size: 18px; font-weight: 650; }
      .connection {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
      .dot.ok { background: var(--green); }
      .dot.err { background: var(--red); }
      .toolbar { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .strategy-updates {
        order: 3;
        flex: 1 0 100%;
        min-width: 0;
        display: flex;
        gap: 18px;
        padding-top: 9px;
        border-top: 1px solid var(--line);
        overflow-x: auto;
        color: var(--muted);
        font-size: 12px;
        scrollbar-width: thin;
      }
      .strategy-update { display: inline-flex; align-items: baseline; gap: 7px; flex: 0 0 auto; }
      .strategy-update-name { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .strategy-update time { color: var(--text); font-variant-numeric: tabular-nums; }
      .strategy-update.unknown time { color: var(--amber); }
      select, input, button {
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        padding: 0 10px;
        font: inherit;
        font-size: 13px;
      }
      select { min-width: 190px; }
      input { width: 180px; }
      button { cursor: pointer; }
      button:hover { border-color: var(--cyan); }
      main { padding: 16px 18px 28px; display: grid; gap: 16px; }
      .risk-band {
        display: grid;
        grid-template-columns: repeat(6, minmax(130px, 1fr));
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--surface);
      }
      .metric { padding: 14px; border-right: 1px solid var(--line); min-width: 0; }
      .metric:last-child { border-right: 0; }
      .metric label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 6px; }
      .metric strong { display: block; font-size: 20px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
      .section { border-top: 1px solid var(--line); padding-top: 14px; min-width: 0; }
      .section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
      .section-head h2 { margin: 0; font-size: 14px; }
      .view-switch {
        display: inline-flex;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
      }
      .view-switch button {
        height: 27px;
        padding: 0 10px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--muted);
      }
      .view-switch button[aria-pressed="true"] {
        background: #263341;
        color: var(--text);
      }
      .meta { color: var(--muted); font-size: 12px; }
      .meta.stale { color: var(--red); }
      .summary { margin-left: auto; display: flex; gap: 18px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
      .summary strong { color: var(--text); font-variant-numeric: tabular-nums; }
      .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
      table { width: 100%; min-width: 1160px; border-collapse: collapse; }
      thead { position: sticky; top: 0; background: var(--surface-2); z-index: 1; }
      th, td {
        height: 40px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        text-align: right;
        white-space: nowrap;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      th { color: var(--muted); font-weight: 550; }
      th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
      tbody tr:last-child td { border-bottom: 0; }
      tbody tr:hover { background: #18212b; }
      .aggregate-row { background: #151e27; font-weight: 600; }
      .aggregate-row td { border-top: 1px solid #3b4857; }
      .detail-row td:first-child { padding-left: 36px; position: relative; }
      .detail-row td:first-child::before {
        content: "";
        position: absolute;
        left: 20px;
        top: 12px;
        width: 6px;
        height: 12px;
        border-left: 1px solid #526174;
        border-bottom: 1px solid #526174;
      }
      .group-label { display: inline-flex; align-items: center; gap: 7px; }
      button.group-toggle {
        width: 24px;
        min-width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        background: transparent;
        display: inline-grid;
        place-items: center;
      }
      button.group-toggle::before {
        content: "";
        width: 7px;
        height: 7px;
        border-right: 2px solid var(--muted);
        border-bottom: 2px solid var(--muted);
        transform: rotate(-45deg);
        transition: transform 120ms ease;
      }
      button.group-toggle[aria-expanded="true"]::before { transform: rotate(45deg); }
      button.group-toggle:hover::before { border-color: var(--cyan); }
      .scope-label { color: var(--cyan); }
      .positive { color: var(--green); }
      .negative { color: var(--red); }
      .muted { color: var(--muted); }
      .status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 74px;
        height: 23px;
        padding: 0 7px;
        border: 1px solid var(--line);
        border-radius: 5px;
        color: var(--muted);
        font-size: 11px;
      }
      .status.done { color: var(--green); border-color: #287a45; }
      .status.wait { color: var(--amber); border-color: #82661d; }
      .empty { padding: 42px; text-align: center; color: var(--muted); }
      @media (max-width: 980px) {
        .risk-band { grid-template-columns: repeat(3, 1fr); }
        .metric:nth-child(3) { border-right: 0; }
        .metric:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
        .toolbar { margin-left: 0; width: 100%; }
        select, input { flex: 1; min-width: 130px; }
      }
      @media (max-width: 560px) {
        header, main { padding-left: 10px; padding-right: 10px; }
        .strategy-update-name { max-width: 210px; }
        #budget { font-size:14px; }
        .risk-band { grid-template-columns: repeat(2, 1fr); }
        .metric { border-bottom: 1px solid var(--line); }
        .metric:nth-child(2n) { border-right: 0; }
        .metric:nth-last-child(-n+2) { border-bottom: 0; }
      }

      /* Same shell and table styling as the USD-M Exec dashboard. */
      [hidden] { display:none !important; }
      .toolbar select { min-width:140px; max-width:250px; }
      .check { display:inline-flex; align-items:center; gap:5px; }
      .check input { width:auto; min-width:0; flex:0 0 auto; height:auto; margin:0; }
      .status.error { color:var(--red); border-color:#8c3e50; }
      .positions-wrap { max-height:62vh; }
      .table-note { margin-top:8px; font-size:11px; }
      .retained td { color:var(--muted); }
      .group-label { max-width:520px; }
      .contract-code { color:var(--muted); margin-left:6px; font-weight:400; }
      @media(max-width:560px) { .toolbar select,.toolbar input { max-width:none; flex:1 1 130px; } }
</style></head>
<body>
  <header>
    <h1>国内期货 Exec 执行监控</h1>
    <div class="connection"><span id="conn-dot" class="dot"></span><span id="connection">连接中</span><span id="mode" class="status wait">持仓观察</span><span id="updated">--</span></div>
    <div class="toolbar">
      <select id="venue" aria-label="交易所筛选"><option value="">全部交易所</option><option value="CFFEX">中金所</option><option value="SHFE">上期所</option><option value="INE">上期能源</option><option value="CZCE">郑商所</option><option value="DCE">大商所</option><option value="GFEX">广期所</option></select>
      <input id="symbol" placeholder="中文名称 / 合约代码" aria-label="合约筛选">
      <button id="refresh" type="button">重新连接</button>
    </div>
    <div id="source-updates" class="strategy-updates" aria-label="运行状态和更新时间"></div>
  </header>
  <main>
    <section class="risk-band" aria-label="持仓概览">
      <div class="metric"><label>本地预算 · 人民币元 <span title="执行端本地保守预算，不是账户权益">ⓘ</span></label><strong id="budget">--</strong></div>
      <div class="metric"><label>持仓合约数</label><strong id="contract-count">--</strong></div>
      <div class="metric"><label>多头持仓 · 手</label><strong id="long-lots">--</strong></div>
      <div class="metric"><label>空头持仓 · 手</label><strong id="short-lots">--</strong></div>
      <div class="metric"><label>冻结持仓 · 手</label><strong id="frozen-lots">--</strong></div>
      <div class="metric"><label>最近采集 · 北京时间</label><strong id="last-capture">--</strong></div>
    </section>
    <div id="notice" class="meta" role="status" hidden></div>
    <section class="section">
      <div class="section-head">
        <h2>实际持仓</h2>
        <div class="view-switch" role="group" aria-label="持仓分组方式"><button data-position-view="symbol" aria-pressed="true">按合约</button><button data-position-view="side" aria-pressed="false">分方向</button></div>
        <label class="meta check"><input id="show-zero" type="checkbox">显示零仓位</label>
        <span id="position-note" class="meta">等待持仓数据</span>
        <div class="summary"><span>合约 <strong id="filtered-contracts">--</strong></span><span>多头 <strong id="filtered-long">--</strong></span><span>空头 <strong id="filtered-short">--</strong></span></div>
      </div>
      <div class="table-wrap positions-wrap"><table><thead id="position-head"></thead><tbody id="positions"></tbody></table></div>
      <div class="meta table-note">数量单位：手；金额单位：人民币元。多空分别保留，净仓按同账户、同交易所、同合约计算。持仓金额需有估值价和合约乘数后计算。</div>
    </section>
  </main>
  <script>
  (() => {
    "use strict";
    const WS_PATH = __CN_FUTURES_WS_PATH__;
    const $ = id => document.getElementById(id);
    const escape = value => String(value ?? "--").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const qty = new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 0 });
    const cash = new Intl.NumberFormat("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmt = value => value == null ? "--" : qty.format(value);
    const yuan = value => Number.isFinite(value) ? '¥ ' + cash.format(value) : '--';
    const time = (us, date = false) => us ? new Date(Number(us) / 1000).toLocaleString("zh-CN", { timeZone: "Asia/Shanghai", hour12: false, ...(date ? {} : { hour: "2-digit", minute: "2-digit", second: "2-digit" }) }) : "--";
    // Display names only. Contract quantities and money are never derived from this catalog.
    const products = {
      CFFEX: {IF:'沪深300股指',IH:'上证50股指',IC:'中证500股指',IM:'中证1000股指',IO:'沪深300股指',HO:'上证50股指',MO:'中证1000股指',T:'10年期国债',TF:'5年期国债',TS:'2年期国债',TL:'30年期国债'},
      SHFE: {CU:'沪铜',AL:'沪铝',ZN:'沪锌',PB:'沪铅',NI:'沪镍',SN:'沪锡',AO:'氧化铝',AD:'铸造铝合金',AU:'沪金',AG:'沪银',RB:'螺纹钢',HC:'热轧卷板',SS:'不锈钢',WR:'线材',FU:'燃料油',BU:'石油沥青',RU:'天然橡胶',SP:'纸浆',BR:'丁二烯橡胶',OP:'胶版印刷纸'},
      INE: {SC:'原油',NR:'20号胶',LU:'低硫燃料油',BC:'国际铜',EC:'集运指数（欧线）'},
      DCE: {A:'豆一',B:'豆二',M:'豆粕',Y:'豆油',P:'棕榈油',C:'玉米',CS:'玉米淀粉',RR:'粳米',JD:'鸡蛋',LH:'生猪',I:'铁矿石',J:'焦炭',JM:'焦煤',L:'聚乙烯',V:'聚氯乙烯',PP:'聚丙烯',EG:'乙二醇',EB:'苯乙烯',PG:'液化石油气',FB:'纤维板',BB:'胶合板',LG:'原木',BZ:'纯苯'},
      CZCE: {WH:'强麦',PM:'普麦',RI:'早籼稻',LR:'晚籼稻',JR:'粳稻',CF:'棉花',CY:'棉纱',SR:'白糖',OI:'菜籽油',RO:'菜籽油',RM:'菜籽粕',RS:'油菜籽',TA:'PTA',MA:'甲醇',ME:'甲醇',FG:'玻璃',SA:'纯碱',PF:'短纤',PX:'对二甲苯',SH:'烧碱',PR:'瓶片',ZC:'动力煤',TC:'动力煤',SF:'硅铁',SM:'锰硅',AP:'苹果',CJ:'红枣',PK:'花生'},
      GFEX: {SI:'工业硅',LC:'碳酸锂',PS:'多晶硅',PT:'铂',PD:'钯'}
    };
    function contractName(venue, symbol, tradingDay) {
      const match = /^([a-z]+)([0-9]{3,4})(?:-?([cp])-?([0-9]+(?:\.[0-9]+)?))?$/i.exec(symbol);
      if (!match) return symbol;
      const [, product, code, option, strike] = match, name = products[venue]?.[product.toUpperCase()];
      const month = Number(code.slice(-2));
      if (!name || month < 1 || month > 12) return symbol;
      const yearCode = Number(code.slice(0,-2));
      let year;
      if (code.length === 4) year = 2000 + yearCode;
      else {
        // CZCE's YMM uses the producer's trading year, including decade rollover.
        if (!/^[0-9]{8}$/.test(tradingDay || '')) return name + ' · ' + code + '（合约年月码）';
        const reference = Number(tradingDay.slice(0,4)), decade = Math.floor(reference / 10) * 10;
        year = [decade-10+yearCode,decade+yearCode,decade+10+yearCode].sort((a,b)=>Math.abs(a-reference)-Math.abs(b-reference))[0];
      }
      return name + ' · ' + year + '年' + String(month).padStart(2,'0') + '月' + (option ? ' · ' + (option.toUpperCase()==='C'?'看涨':'看跌') + ' · 行权价 ' + strike : '');
    }
    const contractLabel = g => {
      const name=contractName(g.venue,g.symbol,g.source.entry?.trading_day);
      return `<span class="scope-label">${escape(name)}</span>${name===g.symbol?'':`<span class="contract-code">${escape(g.symbol)}</span>`}`;
    };
    const state = { sources:new Map(), ws:null, timer:null, view:'symbol', expanded:new Set(), groups:[] };
    const status = source => {
      const s = source.entry;
      if (source.error) return s ? 'unavailable' : 'waiting';
      if (!s) return 'waiting';
      if (s.runtime_status !== 'running') return s.runtime_status;
      const age = Date.now() - Number(s.observed_us) / 1000;
      if (age < 0 || age > source.stale_after_ms) return 'stale';
      if (!s.position_ready) return 'recovering';
      if (!s.connected) return 'disconnected';
      if (!s.ready || !s.transport_ready) return 'unavailable';
      return 'observing';
    };
    const names = {waiting:'等待数据',unavailable:'来源不可用',stopped:'已停止',failed:'执行失败',recovering:'恢复中',disconnected:'已断线',stale:'数据延迟',observing:'已同步'};
    const badge = phase => `<span class="status ${phase==='observing'?'done':['failed','disconnected','unavailable'].includes(phase)?'error':'wait'}">${escape(names[phase] || phase)}</span>`;
    const venueName = value => ({CFFEX:'中金所',SHFE:'上期所',INE:'上期能源',CZCE:'郑商所',DCE:'大商所',GFEX:'广期所'}[value] || value);
    const adapterName = source => source.adapter==='yida'?'易达':'CTP';
    const side = value => `<span class="${value==='buy'?'positive':'negative'}">${value==='buy'?'多头':'空头'}</span>`;
    const match = (venue,symbol,day) => (!$('venue').value || venue===$('venue').value) && (symbol+' '+contractName(venue,symbol,day)).toLowerCase().includes($('symbol').value.trim().toLowerCase());
    function rows(id, content, columns, empty) { $(id).innerHTML=content || `<tr><td class="empty" colspan="${columns}">${escape(empty)}</td></tr>`; }
    function connection(text,kind) { $('connection').textContent=text; $('conn-dot').className='dot '+(kind||''); }
    function positionGroups(sources, filtered = true) {
      const groups = new Map();
      for (const source of sources) {
        const snapshot = source.entry;
        for (const p of snapshot?.positions || []) {
          if (!snapshot.position_ready || (filtered && !match(p.venue, p.symbol, snapshot.trading_day))) continue;
          const key = JSON.stringify([source.source_id, p.venue, p.symbol]);
          if (!groups.has(key)) groups.set(key, {key,source,symbol:p.symbol,venue:p.venue,positions:[],long:0,short:0,frozenLong:0,frozenShort:0,todayLong:0,todayShort:0,yesterdayLong:0,yesterdayShort:0});
          const g = groups.get(key), value = p.position, long = p.side === "buy";
          g.positions.push(p);
          g[long ? "long" : "short"] += value.today + value.yesterday;
          g[long ? "frozenLong" : "frozenShort"] += value.frozen_today + value.frozen_yesterday;
          g[long ? "todayLong" : "todayShort"] += value.today;
          g[long ? "yesterdayLong" : "yesterdayShort"] += value.yesterday;
        }
      }
      for (const group of groups.values()) group.positions = group.positions.filter(p => $('show-zero').checked || p.position.today || p.position.yesterday || p.position.frozen_today || p.position.frozen_yesterday);
      return [...groups.values()].filter(g => $('show-zero').checked || g.long || g.short || g.frozenLong || g.frozenShort).sort((a,b) => a.source.source_id.localeCompare(b.source.source_id) || a.venue.localeCompare(b.venue) || a.symbol.localeCompare(b.symbol));
    }

    function renderOverview(sources,groups) {
      const known=sources.length && sources.every(s=>s.entry?.position_ready);
      $('contract-count').textContent=known?fmt(groups.length):'--';
      $('long-lots').textContent=known?fmt(groups.reduce((n,g)=>n+g.long,0)):'--';
      $('short-lots').textContent=known?fmt(groups.reduce((n,g)=>n+g.short,0)):'--';
      $('frozen-lots').textContent=known?fmt(groups.reduce((n,g)=>n+g.frozenLong+g.frozenShort,0)):'--';
      $('budget').textContent=sources.length===1?yuan(sources[0].entry?.available_local_budget):'--';
      $('budget').title=$('budget').textContent+' 人民币元';
      const captured=sources.map(s=>s.entry?.observed_us).filter(Boolean);
      $('last-capture').textContent=captured.length?time(Math.min(...captured)):'--';
      $('updated').textContent=captured.length?'更新于 '+time(Math.min(...captured),true):'--';
      $('mode').textContent=sources.length && sources.every(s=>s.entry && !s.entry.can_trade)?'当前不可交易':'持仓观察';
      $('source-updates').innerHTML=sources.map(s=>`<div class="strategy-update"><span class="strategy-update-name">${adapterName(s)}</span>${badge(status(s))}<span>交易日 ${escape(s.entry?.trading_day)}</span><time>${time(s.entry?.observed_us)}</time></div>`).join('');
      const problems=sources.flatMap(s=>[s.error,status(s)==='observing'?null:s.entry?.reason,status(s)==='stale'?'持仓心跳过期，保留最后已知仓位':null].filter(Boolean).map(reason=>adapterName(s)+'：'+reason));
      $('notice').hidden=!problems.length; $('notice').textContent=problems.join(' · '); $('notice').className='meta stale';
    }
    function renderPositions(sources, groups) {
      state.groups = groups;
      const sums = {long:0,short:0}; groups.forEach(g => {sums.long+=g.long;sums.short+=g.short;});
      const known = sources.length && sources.every(s => s.entry?.position_ready);
      $('filtered-contracts').textContent = known ? fmt(groups.length) : '--'; $('filtered-long').textContent = known ? fmt(sums.long) + ' 手' : '--'; $('filtered-short').textContent = known ? fmt(sums.short) + ' 手' : '--';
      const ready = sources.length && sources.every(s => s.entry?.position_ready);
      $('position-note').textContent = !ready ? "等待持仓恢复" : `${groups.length} 个合约 · ${groups.reduce((n,g)=>n+g.positions.length,0)} 条多空记录`;
      let content = '';
      if (state.view === "symbol") {
        $('position-head').innerHTML = '<tr><th>合约</th><th>交易所</th><th>状态</th><th>净持仓 · 手</th><th>多头 · 手</th><th>空头 · 手</th><th>今仓 多 / 空 · 手</th><th>昨仓 多 / 空 · 手</th><th>冻结 多 / 空 · 手</th><th>可平 多 / 空 · 手</th><th>更新时间</th></tr>';
        groups.forEach((g,index) => {
          const open=state.expanded.has(g.key), net=g.long-g.short;
          content += `<tr class="aggregate-row ${status(g.source)!=='observing'?'retained':''}"  data-symbol="${escape(g.symbol)}"><td><span class="group-label"><button class="group-toggle" data-group="${index}" aria-expanded="${open}" aria-label="展开 ${escape(g.symbol)}"></button>${contractLabel(g)}</span></td><td>${escape(venueName(g.venue))}</td><td>${badge(status(g.source))}</td><td class="${net>0?'positive':net<0?'negative':''}">${fmt(net)}</td><td class="positive">${fmt(g.long)}</td><td class="negative">${fmt(g.short)}</td><td>${fmt(g.todayLong)} / ${fmt(g.todayShort)}</td><td>${fmt(g.yesterdayLong)} / ${fmt(g.yesterdayShort)}</td><td>${fmt(g.frozenLong)} / ${fmt(g.frozenShort)}</td><td>${fmt(g.long-g.frozenLong)} / ${fmt(g.short-g.frozenShort)}</td><td>${time(g.source.entry?.observed_us)}</td></tr>`;
          if (open) content += g.positions.map(p => {const v=p.position;return `<tr class="detail-row" ><td>${side(p.side)}</td><td>${escape(venueName(g.venue))}</td><td>${badge(status(g.source))}</td><td>${p.side==='buy'?'':'−'}${fmt(v.today+v.yesterday)}</td><td>${p.side==='buy'?fmt(v.today+v.yesterday):'--'}</td><td>${p.side==='sell'?fmt(v.today+v.yesterday):'--'}</td><td>${fmt(v.today)}</td><td>${fmt(v.yesterday)}</td><td>${fmt(v.frozen_today+v.frozen_yesterday)}</td><td>${fmt(v.today+v.yesterday-v.frozen_today-v.frozen_yesterday)}</td><td>${time(g.source.entry?.observed_us)}</td></tr>`;}).join('');
        });
      } else {
        $('position-head').innerHTML = '<tr><th>合约</th><th>交易所</th><th>方向</th><th>持仓 · 手</th><th>今仓 · 手</th><th>昨仓 · 手</th><th>冻结今仓 · 手</th><th>冻结昨仓 · 手</th><th>可平 · 手</th><th>状态</th><th>更新时间</th></tr>';
        content = groups.flatMap(g=>g.positions.map(p=>{const v=p.position;return `<tr  data-symbol="${escape(g.symbol)}" class="${status(g.source)!=='observing'?'retained':''}"><td>${contractLabel(g)}</td><td>${escape(venueName(p.venue))}</td><td>${side(p.side)}</td><td>${fmt(v.today+v.yesterday)}</td><td>${fmt(v.today)}</td><td>${fmt(v.yesterday)}</td><td>${fmt(v.frozen_today)}</td><td>${fmt(v.frozen_yesterday)}</td><td>${fmt(v.today+v.yesterday-v.frozen_today-v.frozen_yesterday)}</td><td>${badge(status(g.source))}</td><td>${time(g.source.entry?.observed_us)}</td></tr>`;})).join('');
      }
      const empty = !sources.length ? "等待持仓数据" : !ready ? "等待柜台完成持仓恢复" : sources.some(s=>status(s)!=='observing') ? "持仓数据未就绪，等待更新" : $('symbol').value || $('venue').value ? "当前筛选没有持仓" : "当前无持仓";
      rows('positions',content,11,empty);
    }

    function render() {
      const sources=[...state.sources.values()], allGroups=positionGroups(sources,false).filter(g=>g.long||g.short||g.frozenLong||g.frozenShort);
      renderOverview(sources,allGroups); renderPositions(sources,positionGroups(sources));
    }
    function accept(frame) {
      if (frame.type!=='cn_futures_state' || !frame.source_id) return;
      state.sources.set(frame.source_id,frame); render();
    }
    function connect() {
      clearTimeout(state.timer);
      if(state.ws){state.ws.onclose=null;state.ws.close();}
      connection('连接中','');
      const ws=state.ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+WS_PATH);
      ws.onopen=()=>connection('实时连接','ok');
      ws.onmessage=event=>{try{accept(JSON.parse(event.data));}catch(error){console.error(error);}};
      ws.onerror=()=>ws.close();
      ws.onclose=()=>{connection('重连中','err');state.timer=setTimeout(connect,2000);};
    }
    document.addEventListener('click',event=>{
      const button=event.target.closest('[data-group]'); if(!button)return;
      const key=state.groups[Number(button.dataset.group)]?.key; if(!key)return;
      state.expanded.has(key)?state.expanded.delete(key):state.expanded.add(key);render();
    });
    document.querySelectorAll('[data-position-view]').forEach(button=>button.onclick=()=>{state.view=button.dataset.positionView;document.querySelectorAll('[data-position-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render();});
    ['venue','show-zero'].forEach(id=>$(id).onchange=render);$('symbol').oninput=render;
    $('refresh').onclick=connect;
    render();setInterval(render,1000);connect();
  })();
  </script>
</body></html>
