<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>国内期货 Exec 执行监控</title>
<style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        --bg: #0b0f14;
        --surface: #121820;
        --surface-2: #171f29;
        --line: #2a3441;
        --text: #edf2f7;
        --muted: #91a0b2;
        --green: #4ade80;
        --red: #fb7185;
        --amber: #fbbf24;
        --cyan: #38bdf8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        letter-spacing: 0;
      }
      header {
        min-height: 62px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--line);
        background: #0e141b;
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      h1 { margin: 0; font-size: 18px; font-weight: 650; }
      .connection {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
      .dot.ok { background: var(--green); }
      .dot.err { background: var(--red); }
      .toolbar { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .strategy-updates {
        order: 3;
        flex: 1 0 100%;
        min-width: 0;
        display: flex;
        gap: 18px;
        padding-top: 9px;
        border-top: 1px solid var(--line);
        overflow-x: auto;
        color: var(--muted);
        font-size: 12px;
        scrollbar-width: thin;
      }
      .strategy-update { display: inline-flex; align-items: baseline; gap: 7px; flex: 0 0 auto; }
      .strategy-update-name { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .strategy-update time { color: var(--text); font-variant-numeric: tabular-nums; }
      .strategy-update.unknown time { color: var(--amber); }
      input, button {
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        padding: 0 10px;
        font: inherit;
        font-size: 13px;
      }
      input { width: 180px; }
      button { cursor: pointer; }
      button:hover { border-color: var(--cyan); }
      main { padding: 16px 18px 28px; display: grid; gap: 16px; }
      .risk-band, .account-band {
        display: grid;
        grid-template-columns: repeat(4, minmax(130px, 1fr));
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--surface);
      }
      .risk-band.single-amount { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .metric { padding: 14px; border-right: 1px solid var(--line); min-width: 0; }
      .metric:last-child { border-right: 0; }
      .metric label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 6px; }
      .metric strong { display: block; font-size: 20px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
      .section { border-top: 1px solid var(--line); padding-top: 14px; min-width: 0; }
      .section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
      .section-head h2 { margin: 0; font-size: 14px; }
      .meta { color: var(--muted); font-size: 12px; }
      .meta.stale { color: var(--red); }
      .summary { margin-left: auto; display: flex; gap: 18px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
      .summary strong { color: var(--text); font-variant-numeric: tabular-nums; }
      .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
      table { width: 100%; min-width: 640px; border-collapse: collapse; }
      thead { position: sticky; top: 0; background: var(--surface-2); z-index: 1; }
      th, td {
        height: 40px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        text-align: right;
        white-space: nowrap;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      th { color: var(--muted); font-weight: 550; }
      th:first-child, td:first-child { text-align: left; }
      tbody tr:last-child td { border-bottom: 0; }
      tbody tr:hover { background: #18212b; }
      .aggregate-row { background: #151e27; font-weight: 600; }
      .aggregate-row td { border-top: 1px solid #3b4857; }
      .detail-row > td { padding:8px 12px 12px; background:var(--bg); }
      .position-detail { border:1px solid var(--line); border-radius:6px; overflow:auto; }
      .position-detail table { min-width:0; }
      .position-detail thead { position:static; }
      .strategy-detail th:first-child, .strategy-detail td:first-child { white-space:normal; overflow-wrap:anywhere; }
      .strategy-heading { margin:0 0 8px; text-align:left; font-size:13px; }
      .strategy-target { display:block; margin-top:2px; }
      .strategy-message { padding:10px; text-align:left; white-space:normal; }
      .strategy-message a { color:var(--cyan); }
      .attribution-gap { color:var(--amber); font-size:12px; margin:8px 0; white-space:normal; }
      .broker-toggle { height:28px; margin-top:8px; color:var(--muted); font-size:12px; }
      .broker-toggle + .position-detail { margin-top:6px; }
      .group-label { display: inline-flex; align-items: center; gap: 7px; }
      button.group-toggle {
        width: 24px;
        min-width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        background: transparent;
        display: inline-grid;
        place-items: center;
      }
      button.group-toggle::before {
        content: "";
        width: 7px;
        height: 7px;
        border-right: 2px solid var(--muted);
        border-bottom: 2px solid var(--muted);
        transform: rotate(-45deg);
        transition: transform 120ms ease;
      }
      button.group-toggle[aria-expanded="true"]::before { transform: rotate(45deg); }
      button.group-toggle:hover::before { border-color: var(--cyan); }
      .scope-label { color: var(--cyan); }
      .positive { color: var(--green); }
      .negative { color: var(--red); }
      .muted { color: var(--muted); }
      .status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 74px;
        height: 23px;
        padding: 0 7px;
        border: 1px solid var(--line);
        border-radius: 5px;
        color: var(--muted);
        font-size: 11px;
      }
      .status.done { color: var(--green); border-color: #287a45; }
      .status.wait { color: var(--amber); border-color: #82661d; }
      .empty { padding: 42px; text-align: center; color: var(--muted); }
      @media (max-width: 980px) {
        .risk-band, .risk-band.single-amount, .account-band { grid-template-columns: repeat(2, 1fr); }
        .risk-band.single-amount .metric:last-child { grid-column: 1 / -1; }
        .metric:nth-child(2n) { border-right: 0; }
        .metric:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
        .toolbar { margin-left: 0; width: 100%; }
        input { flex: 1; min-width: 130px; }
      }
      @media (max-width: 560px) {
        header, main { padding-left: 10px; padding-right: 10px; }
        .strategy-update-name { max-width: 210px; }
        #futures-amount, #options-amount { font-size:14px; }
        .risk-band, .account-band { grid-template-columns: repeat(2, 1fr); }
        .metric { border-bottom: 1px solid var(--line); }
        .metric:nth-child(2n) { border-right: 0; }
        .metric:nth-last-child(-n+2) { border-bottom: 0; }
      }

      /* Same shell and table styling as the USD-M Exec dashboard. */
      [hidden] { display:none !important; }
      .check { display:inline-flex; align-items:center; gap:5px; }
      .check input { width:auto; min-width:0; flex:0 0 auto; height:auto; margin:0; }
      .status.error { color:var(--red); border-color:#8c3e50; }
      .positions-wrap { max-height:62vh; }
      .table-note { margin-top:8px; font-size:11px; }
      #strategy-status a { color:var(--cyan); }
      .source-tabs { display:flex; gap:8px; margin-top:10px; }
      .source-tabs button[aria-selected="true"] { color:var(--cyan); border-color:var(--cyan); }
      .account-band.stale strong { color:var(--amber); }
      @media (min-width:981px) {
        .account-band { grid-template-columns: repeat(12, minmax(0, 1fr)); }
        .account-band .metric { grid-column:span 4; }
        .account-band .metric:nth-child(-n+4) { grid-column:span 3; border-bottom:1px solid var(--line); }
        .account-band .metric:nth-child(4) { border-right:0; }
      }
      @media (max-width:980px) {
        .account-band .metric { border-bottom:1px solid var(--line); }
        .account-band .metric:last-child { grid-column:1 / -1; border-bottom:0; }
      }
      .quote-status { color:var(--muted); font-size:12px; }
      .quote-status.stale { color:var(--amber); }
      .valuation-basis { padding:10px; border-bottom:1px solid var(--line); color:var(--muted); font-size:12px; white-space:normal; }
      .net-amount { min-width:140px; }
      .retained td { color:var(--muted); }
      .group-label { max-width:520px; }
      .contract-code { color:var(--muted); margin-left:6px; font-weight:400; }
      @media(max-width:560px) {
        .toolbar input { max-width:none; flex:1 1 130px; }
        .aggregate-row .group-label { max-width:188px; }
        .aggregate-row .scope-label { white-space:normal; }
        .detail-row > td { width:calc(100vw - 22px); max-width:calc(100vw - 22px); }
        .position-detail { max-width:calc(100vw - 46px); }
        .strategy-detail th, .strategy-detail td { padding-inline:6px; }
      }
</style></head>
<body>
  <header>
    <h1>国内期货 Exec 执行监控</h1>
    <div class="connection"><span id="conn-dot" class="dot"></span><span id="connection">连接中</span><span id="mode" class="status wait">持仓观察</span><span id="updated">--</span></div>
    <div class="toolbar">
      <input id="symbol" placeholder="中文名称 / 合约代码" aria-label="合约筛选">
      <button id="refresh" type="button">重新连接</button>
    </div>
    <div id="source-tabs" class="source-tabs" role="tablist" aria-label="柜台来源" hidden></div>
    <div id="source-updates" class="strategy-updates" aria-label="运行状态和更新时间"></div>
  </header>
  <main>
    <section aria-label="账户资金">
      <div class="section-head"><h2>账户资金 · 人民币元</h2><span id="funds-status" class="meta">等待柜台资金查询</span></div>
      <div id="account-funds" class="account-band">
        <div class="metric"><label>账户权益</label><strong id="account-balance">--</strong></div>
        <div class="metric"><label>可用资金</label><strong id="account-available">--</strong></div>
        <div class="metric"><label>可取资金</label><strong id="account-withdrawable">--</strong></div>
        <div class="metric"><label>占用保证金</label><strong id="account-margin">--</strong></div>
        <div class="metric"><label>持仓盈亏</label><strong id="account-position-profit">--</strong></div>
        <div class="metric"><label>平仓盈亏</label><strong id="account-close-profit">--</strong></div>
        <div class="metric"><label>当日手续费</label><strong id="account-commission">--</strong></div>
      </div>
    </section>
    <section class="risk-band single-amount" aria-label="持仓概览">
      <div class="metric"><label>持仓合约数</label><strong id="contract-count">--</strong></div>
      <div id="futures-metric" class="metric"><label id="futures-amount-label" title="净名义金额＝净手数 × 合约乘数 × L1 估值价">持仓金额 · 元</label><strong id="futures-amount">--</strong></div>
      <div id="options-metric" class="metric" hidden><label title="净权利金市值＝净手数 × 合约乘数 × L1 估值价">期权持仓金额 · 元</label><strong id="options-amount">--</strong></div>
      <div class="metric"><label>行情覆盖 · 合约</label><strong id="valuation-coverage">--</strong></div>
    </section>
    <div id="notice" class="meta" role="status" hidden></div>
    <section class="section">
      <div class="section-head">
        <h2>合约净持仓</h2>
        <label class="meta check"><input id="show-zero" type="checkbox">显示零仓位</label>
        <span id="position-note" class="meta">等待持仓数据</span>
        <span id="strategy-status" class="meta" role="status" hidden></span>
        <span id="quote-status" class="quote-status"></span>
        <div class="summary"><span>合约 <strong id="filtered-contracts">--</strong></span><span>净多合约 <strong id="filtered-net-long">--</strong></span><span>净空合约 <strong id="filtered-net-short">--</strong></span></div>
      </div>
      <div class="table-wrap positions-wrap"><table><thead id="position-head"></thead><tbody id="positions"></tbody></table></div>
      <div class="meta table-note">正数净多，负数净空。策略净仓来自 Manager 账本，柜台净仓来自持仓快照。</div>
    </section>
  </main>
  <script>
  (() => {
    "use strict";
    const WS_PATH = __CN_FUTURES_WS_PATH__;
    const STRATEGY_SOURCES = new Set(__CN_FUTURES_STRATEGY_SOURCES__);
    const $ = id => document.getElementById(id);
    const escape = value => String(value ?? "--").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const qty = new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 0 });
    const cash = new Intl.NumberFormat("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmt = value => value == null ? "--" : qty.format(value);
    const signed = value => value > 0 ? '+' + fmt(value) : fmt(value);
    const qtyClass = value => value > 0 ? 'positive' : value < 0 ? 'negative' : '';
    const yuan = value => Number.isFinite(value) ? '¥ ' + cash.format(value) : '--';
    const time = (us, date = false) => us ? new Date(Number(us) / 1000).toLocaleString("zh-CN", { timeZone: "Asia/Shanghai", hour12: false, ...(date ? {} : { hour: "2-digit", minute: "2-digit", second: "2-digit" }) }) : "--";
    // Display names only. Contract quantities and money are never derived from this catalog.
    const products = {
      CFFEX: {IF:'沪深300股指',IH:'上证50股指',IC:'中证500股指',IM:'中证1000股指',IO:'沪深300股指',HO:'上证50股指',MO:'中证1000股指',T:'10年期国债',TF:'5年期国债',TS:'2年期国债',TL:'30年期国债'},
      SHFE: {CU:'沪铜',AL:'沪铝',ZN:'沪锌',PB:'沪铅',NI:'沪镍',SN:'沪锡',AO:'氧化铝',AD:'铸造铝合金',AU:'沪金',AG:'沪银',RB:'螺纹钢',HC:'热轧卷板',SS:'不锈钢',WR:'线材',FU:'燃料油',BU:'石油沥青',RU:'天然橡胶',SP:'纸浆',BR:'丁二烯橡胶',OP:'胶版印刷纸'},
      INE: {SC:'原油',NR:'20号胶',LU:'低硫燃料油',BC:'国际铜',EC:'集运指数（欧线）'},
      DCE: {A:'豆一',B:'豆二',M:'豆粕',Y:'豆油',P:'棕榈油',C:'玉米',CS:'玉米淀粉',RR:'粳米',JD:'鸡蛋',LH:'生猪',I:'铁矿石',J:'焦炭',JM:'焦煤',L:'聚乙烯',V:'聚氯乙烯',PP:'聚丙烯',EG:'乙二醇',EB:'苯乙烯',PG:'液化石油气',FB:'纤维板',BB:'胶合板',LG:'原木',BZ:'纯苯'},
      CZCE: {WH:'强麦',PM:'普麦',RI:'早籼稻',LR:'晚籼稻',JR:'粳稻',CF:'棉花',CY:'棉纱',SR:'白糖',OI:'菜籽油',RO:'菜籽油',RM:'菜籽粕',RS:'油菜籽',TA:'PTA',MA:'甲醇',ME:'甲醇',FG:'玻璃',SA:'纯碱',PF:'短纤',PX:'对二甲苯',SH:'烧碱',PR:'瓶片',ZC:'动力煤',TC:'动力煤',SF:'硅铁',SM:'锰硅',AP:'苹果',CJ:'红枣',PK:'花生'},
      GFEX: {SI:'工业硅',LC:'碳酸锂',PS:'多晶硅',PT:'铂',PD:'钯'}
    };
    function contractName(venue, symbol, tradingDay) {
      const match = /^([a-z]+)([0-9]{3,4})(?:-?([cp])-?([0-9]+(?:\.[0-9]+)?))?$/i.exec(symbol);
      if (!match) return symbol;
      const [, product, code, option, strike] = match, name = products[venue]?.[product.toUpperCase()];
      const month = Number(code.slice(-2));
      if (!name || month < 1 || month > 12) return symbol;
      const yearCode = Number(code.slice(0,-2));
      let year;
      if (code.length === 4) year = 2000 + yearCode;
      else {
        // CZCE's YMM uses the producer's trading year, including decade rollover.
        if (!/^[0-9]{8}$/.test(tradingDay || '')) return name + ' · ' + code + '（合约年月码）';
        const reference = Number(tradingDay.slice(0,4)), decade = Math.floor(reference / 10) * 10;
        year = [decade-10+yearCode,decade+yearCode,decade+10+yearCode].sort((a,b)=>Math.abs(a-reference)-Math.abs(b-reference))[0];
      }
      return name + ' · ' + year + '年' + String(month).padStart(2,'0') + '月' + (option ? ' · ' + (option.toUpperCase()==='C'?'看涨':'看跌') + ' · 行权价 ' + strike : '');
    }
    const contractLabel = g => {
      const name=contractName(g.venue,g.symbol,g.tradingDay);
      return `<span class="scope-label">${escape(name)}</span>${name===g.symbol?'':`<span class="contract-code">${escape(g.symbol)}</span>`}`;
    };
    const managerUrl = new URL('/manager/', location.origin);
    managerUrl.port = '';
    const state = { sources:new Map(), ws:null, timer:null, detailChoices:new Map(), brokerDetails:new Set(), groups:[],
      preferredSource:new URLSearchParams(location.search).get('source'), strategy:null };
    const recoveryReasons = new Map([
      ['CTP trader front offline; waiting for reconnection','waiting-trader'],
      ['CTP market-data front offline; waiting for reconnection','waiting-md'],
      ['CTP account query unavailable; reconciliation pending','waiting-account'],
      ['CTP account query unavailable; cold restart required','restarting'],
      ['CTP market-data trading day unavailable; cold restart required','waiting-md-day'],
      ['session/bootstrap incomplete','recovering'],
      ['recovery persistence pending','recovering'],
    ]);
    const status = source => {
      const s = source.entry;
      if (!s && source.saved_entry && (!source.error || source.error==='等待持仓 IPC')) return 'waiting-counter';
      if (source.error) return s ? 'unavailable' : 'waiting';
      if (!s) return 'waiting';
      const age = Date.now() - Number(s.observed_us) / 1000;
      const recovery = source.adapter==='ctp' ? recoveryReasons.get(s.reason) : undefined;
      const restarting=recovery==='restarting' || recovery==='waiting-md-day';
      if (s.runtime_status==='stopped' && restarting && age>=0 && age<90_000) return recovery;
      if (s.runtime_status !== 'running') return s.runtime_status;
      if (age < 0 || age > source.stale_after_ms) return 'stale';
      if (recovery && !restarting) return recovery;
      if (!s.position_ready) return 'recovering';
      if (!s.connected) return 'disconnected';
      const readOnlySettlement = !s.can_trade && s.reason === 'settlement not confirmed; read-only queries remain available';
      if ((!s.ready && !readOnlySettlement) || !s.transport_ready) return 'unavailable';
      return 'observing';
    };
    const names = {waiting:'等待数据',unavailable:'来源不可用',stopped:'已停止',failed:'柜台运行中断',recovering:'恢复中',disconnected:'已断线',stale:'数据延迟',observing:'已同步',
      'waiting-counter':'等待柜台连接','waiting-trader':'等待柜台重连','waiting-md':'等待行情重连','waiting-account':'等待资金查询与对账',
      'waiting-md-day':'等待行情交易日',restarting:'柜台连接恢复中'};
    const badge = phase => `<span class="status ${phase==='observing'?'done':['failed','disconnected','unavailable'].includes(phase)?'error':'wait'}">${escape(names[phase] || phase)}</span>`;
    const adapterName = source => source.adapter==='yida'?'易达':'CTP';
    const side = value => `<span class="${value==='buy'?'positive':'negative'}">${value==='buy'?'多头':'空头'}</span>`;
    const match = (venue,symbol,day) => (symbol+' '+contractName(venue,symbol,day)).toLowerCase().includes($('symbol').value.trim().toLowerCase());
    function rows(id, content, columns, empty) { $(id).innerHTML=content || `<tr><td class="empty" colspan="${columns}">${escape(empty)}</td></tr>`; }
    function connection(text,kind) { $('connection').textContent=text; $('conn-dot').className='dot '+(kind||''); }
    // A fresh network callback can carry a replayed exchange quote. Compare the
    // SDK-formatted exchange clock and native day; never treat TimeStamp as Unix.
    function oldExchangeQuote(mark,limit) {
      const received=new Date(Number(mark.received_us)/1000+8*3600000);
      if(!Number.isFinite(received.getTime())) return true;
      const calendar=received.toISOString().slice(0,10).replaceAll('-','');
      if(!/^[0-9]{8}$/.test(String(mark.trading_day)) || String(mark.trading_day)<calendar) return true;
      const clock=/^([0-9]{2}):([0-9]{2}):([0-9]{2})(?:\.([0-9]{1,3}))?$/.exec(mark.last_trade_time||mark.native_time||'');
      if(!clock || Number(clock[1])>23 || Number(clock[2])>59 || Number(clock[3])>59) return true;
      const native=((Number(clock[1])*60+Number(clock[2]))*60+Number(clock[3]))*1000+Number((clock[4]||'').padEnd(3,'0'));
      const local=((received.getUTCHours()*60+received.getUTCMinutes())*60+received.getUTCSeconds())*1000+received.getUTCMilliseconds();
      const gap=Math.abs(native-local);
      return Math.min(gap,86400000-gap)>limit;
    }
    const validPrice = price => Number.isFinite(price) && price > 0 && price < Number.MAX_VALUE;
    const hasMid = mark => validPrice(mark.bid_price) && validPrice(mark.ask_price) &&
      mark.bid_price<=mark.ask_price && mark.bid_lots>0 && mark.ask_lots>0;
    const hasQuote = mark => mark && (validPrice(mark.last_price) || hasMid(mark));
    const marketKey = (venue,symbol) => JSON.stringify([venue,symbol]);
    function valuation(g) {
      const mark=g.mark;
      if(!mark || !Number.isInteger(mark.contract_multiple) || mark.contract_multiple<=0) return {amount:null,reason:'等待合约资料与 L1 行情'};
      if(!['future','option'].includes(mark.kind)) return {amount:null,reason:'缺合约类别'};
      const ctp=g.source.adapter==='ctp';
      const mid=ctp && hasMid(mark);
      const price=mid ? mark.bid_price/2+mark.ask_price/2 : mark.last_price;
      const priceLabel=mid ? 'L1 买卖一中间价' : 'L1 最新成交价';
      if(!validPrice(price)) return {amount:null,reason:'等待同交易日 L1 行情'};
      const amount=(g.long-g.short)*mark.contract_multiple*price;
      if(!Number.isFinite(amount)) return {amount:null,reason:'估值超出数值范围'};
      const age=Date.now()-Number(mark.received_us)/1000;
      const oldNative=oldExchangeQuote(mark,g.source.stale_after_ms);
      const historical=g.historical || oldNative || mark.initial || mark.paused || !g.l1Connected || age<0 || age>g.source.stale_after_ms || status(g.source)!=='observing' || !mark.trading_day || !mark.native_time;
      const quoteTime=String(mark.trading_day||'未知交易日')+' '+(mark.last_trade_time||mark.native_time||'时刻未知');
      return {amount,price,priceLabel,historical,reason:mark.initial?(ctp?'已完成分钟的最后一档盘口':'初始快照'+(mark.paused?' · 暂停':'')):mark.paused?'行情中断或暂停':age<0||age>g.source.stale_after_ms?'行情停更':!g.l1Connected?'行情断开':oldNative?'原生行情时间较旧':historical?'来源未就绪':ctp?'通联 L1':'易达 L1',quoteTime};
    }
    function amountCell(g) {
      const v=valuation(g);
      if(v.amount===null) return `<span title="${escape(v.reason)}">--</span>`;
      const kind=g.mark.kind==='option'?'净权利金市值':'净名义金额';
      return `<span title="${escape(kind+'＝净手数 × '+g.mark.contract_multiple+' × '+v.priceLabel+' '+v.price+'；'+(v.historical?'历史行情；':'')+v.quoteTime+'；'+v.reason)}">${escape(yuan(v.amount))}</span>`;
    }
    function totalAmount(groups,kind) {
      if(groups.some(g=>!g.mark || !['future','option'].includes(g.mark.kind))) return null;
      const values=groups.filter(g=>g.mark.kind===kind).map(valuation);
      if(values.some(v=>v.amount===null)) return null;
      const total=values.reduce((n,v)=>n+v.amount,0);
      return Number.isFinite(total)?total:null;
    }
    const activeStrategy = row => row.attributed_lots !== 0 || row.target_lots !== 0;
    const managerObservation = source => source && state.strategy?.id === source.source_id ? state.strategy.observation : null;
    const freshAt = (us, limit) => {
      const age = Date.now() - Number(us) / 1000;
      return us > 0 && age >= 0 && age <= limit;
    };
    function positionView(source) {
      const live=source.entry, saved=source.saved_entry;
      const http=managerObservation(source)?.position;
      const currentHttp=http?.current && freshAt(http.observed_us, source.stale_after_ms);
      const currentLive=live?.position_ready && !source.error
        && (status(source)==='observing' || (live.runtime_status==='running' && live.connected && live.transport_ready &&
            live.ready && freshAt(live.observed_us, source.stale_after_ms)));
      if (currentHttp || (!currentLive && http && (!saved || http.observed_us >= saved.observed_us))) {
        const marks=new Map((http.marks||[]).map(m=>[marketKey(m.venue,m.symbol),m]));
        let l1_connected=http.l1_connected;
        for (const entry of [saved,live]) {
          if (entry?.trading_day!==http.trading_day) continue;
          l1_connected ||= entry.l1_connected;
          for (const mark of entry.marks||[]) {
            const key=marketKey(mark.venue,mark.symbol);
            const previous=marks.get(key);
            const newerLive=entry===live && !mark.initial && hasQuote(mark) &&
              (previous?.initial || Number(mark.received_us)>=Number(previous?.received_us));
            if (!previous || (!hasQuote(previous) && hasQuote(mark)) || newerLive) marks.set(key,mark);
          }
        }
        return {...http, position_ready:true, marks:[...marks.values()], l1_connected, historical:!currentHttp, label:currentHttp?'柜台查询':'Manager 历史持仓'};
      }
      if (currentLive) return live;
      if (saved) return {...saved,historical:true,label:'上次账户快照'};
      if (live?.position_ready && source.adapter==='ctp') return {...live,historical:true,label:'保留上次持仓'};
      return live;
    }
    function positionGroups(sources, filtered = true) {
      const groups = new Map();
      const showZero = filtered && $('show-zero').checked;
      for (const source of sources) {
        const snapshot = positionView(source);
        const marks=new Map((snapshot?.marks||[]).map(m=>[marketKey(m.venue,m.symbol),m]));
        const group = (venue, symbol) => {
          const key = JSON.stringify([source.source_id, venue, symbol]);
          if (!groups.has(key)) groups.set(key, {key,source,symbol,venue,positions:[],mark:marks.get(marketKey(venue,symbol)),
            tradingDay:snapshot?.trading_day,observedUs:snapshot?.observed_us,positionReady:snapshot?.position_ready,
            historical:snapshot?.historical,l1Connected:snapshot?.l1_connected,long:0,short:0});
          return groups.get(key);
        };
        for (const p of snapshot?.positions || []) {
          if (!snapshot.position_ready || (filtered && !match(p.venue, p.symbol, snapshot.trading_day))) continue;
          const lots = p.position.today + p.position.yesterday;
          if (!lots && !showZero) continue;
          const g = group(p.venue,p.symbol);
          g.positions.push(p);
          g[p.side === "buy" ? "long" : "short"] += lots;
        }
        if (filtered && state.strategy?.id === source.source_id) {
          for (const [market, attribution] of Object.entries(state.strategy.contracts || {})) {
            const [venue, symbol] = market.split(':');
            if (!symbol || !match(venue, symbol, snapshot?.trading_day)) continue;
            if (!groups.has(JSON.stringify([source.source_id, venue, symbol])) &&
                !showZero && !attribution.strategies.some(activeStrategy)) continue;
            group(venue, symbol).attribution = attribution;
          }
        }
      }
      return [...groups.values()].sort((a,b) => a.source.source_id.localeCompare(b.source.source_id) || a.venue.localeCompare(b.venue) || a.symbol.localeCompare(b.symbol));
    }

    async function loadStrategy() {
      const strategy = state.strategy;
      if (!strategy || strategy.loading) return;
      strategy.loading = true;
      try {
        const response = await fetch('/strategy-positions/' + encodeURIComponent(strategy.id), {
          cache:'no-store', signal:strategy.controller.signal
        });
        strategy.contracts = response.ok ? await response.json() : null;
        strategy.status = response.status;
      } catch {
        strategy.contracts = null;
        strategy.status = 502;
      } finally {
        strategy.loading = false;
        if (state.strategy === strategy) render();
      }
    }
    async function loadObservation() {
      const strategy=state.strategy;
      if (!strategy || strategy.loadingObservation) return;
      strategy.loadingObservation=true;
      try {
        const response=await fetch('/account-observation/' + encodeURIComponent(strategy.id), {
          cache:'no-store',signal:strategy.controller.signal
        });
        strategy.observation=response.ok ? await response.json() : null;
      } catch {
        strategy.observation=null;
      } finally {
        strategy.loadingObservation=false;
        if (state.strategy===strategy) render();
      }
    }
    function selectStrategySource(source) {
      const id = STRATEGY_SOURCES.has(source?.source_id) ? source.source_id : null;
      if (id === (state.strategy?.id ?? null)) return;
      state.strategy?.controller.abort();
      state.strategy = id ? {id, controller:new AbortController(), loading:false, status:null, contracts:null, observation:null, loadingObservation:false} : null;
      void loadStrategy();
      void loadObservation();
    }
    function strategyMessage() {
      const strategy = state.strategy;
      if (strategy.status === 401) {
        return `<a href="${escape(managerUrl.href)}" target="_blank" rel="noopener">登录 Manager 查看策略仓位</a>`;
      }
      return ({
        200:'该合约没有策略归因记录',
        403:'当前账户或策略无查看权限',
        404:'该账户尚未初始化策略归因',
        502:'策略仓位暂不可用'
      })[strategy.status] ?? '读取策略仓位…';
    }
    const detailOpen = group => state.detailChoices.get(group.key) ?? (Boolean(state.strategy) || Boolean(group.attribution));
    function renderStrategyStatus(groups) {
      const note = $('strategy-status');
      note.hidden = !state.strategy || state.strategy.status === 200 || groups.some(detailOpen);
      if (!note.hidden) note.innerHTML = strategyMessage();
    }

    function renderFunds(source) {
      const entry=source?.entry, live=entry?.account, saved=source?.saved_entry?.account;
      const http=managerObservation(source)?.account;
      const liveCurrent=live && !source.error && entry.runtime_status==='running' && entry.connected && entry.transport_ready
        && freshAt(live.observed_us,30000) && freshAt(entry.observed_us,source.stale_after_ms);
      const httpCurrent=http?.current && freshAt(http.observed_us,30000);
      const historical=[http,saved,live].filter(Boolean).sort((a,b)=>b.observed_us-a.observed_us)[0];
      const account=httpCurrent ? http : liveCurrent ? live : historical;
      const current=account && (account===http ? httpCurrent : account===live && liveCurrent);
      const label=current?'柜台查询':account===http?'Manager 历史资金':account===saved?'上次账户快照':'保留上次查询';
      const values={
        'account-balance':account?.balance, 'account-available':account?.available,
        'account-withdrawable':account?.withdraw_quota, 'account-margin':account?.curr_margin,
        'account-position-profit':account?.position_profit, 'account-close-profit':account?.close_profit,
        'account-commission':account?.commission
      };
      const valid=account?.currency==='CNY' && Number(account.observed_us)>0;
      for (const [id,value] of Object.entries(values)) $(id).textContent=valid && typeof value==='number'?yuan(value):'--';
      const stale=valid && !current;
      $('account-funds').className='account-band'+(stale?' stale':'');
      $('funds-status').className='meta'+(stale?' stale':'');
      $('funds-status').textContent=!valid?'柜台资金尚未就绪':label+' · '+time(account.observed_us,true);
    }
    function selectedSources() {
      const sources=[...state.sources.values()];
      const selected=state.sources.get(state.preferredSource) ?? sources.find(s=>s.adapter==='ctp') ?? sources[0];
      const tabs=sources.map(s=>`<button type="button" role="tab" data-source="${escape(s.source_id)}" aria-selected="${s===selected}">${adapterName(s)}</button>`).join('');
      if ($('source-tabs').innerHTML!==tabs) $('source-tabs').innerHTML=tabs;
      $('source-tabs').hidden=sources.length<=1;
      return selected ? [selected] : [];
    }
    function renderOverview(sources,groups) {
      const known=sources.length && sources.every(s=>positionView(s)?.position_ready);
      $('contract-count').textContent=known?fmt(groups.length):'--';
      const kinds=new Set(groups.map(g=>g.mark?.kind));
      const futures=kinds.has('future'), options=kinds.has('option');
      $('futures-metric').hidden=options&&!futures;
      $('options-metric').hidden=!options;
      $('futures-amount-label').textContent=futures?'期货持仓金额 · 元':'持仓金额 · 元';
      $('futures-metric').closest('.risk-band').classList.toggle('single-amount',!(futures&&options));
      for(const [id,kind] of [['futures-amount','future'],['options-amount','option']]) {
        const amount=known?totalAmount(groups,kind):null;
        $(id).textContent=amount===null?'--':yuan(amount);
        const historical=groups.filter(g=>g.mark?.kind===kind).some(g=>valuation(g).historical);
        $(id).title=amount===null?'估值资料不完整；查看各合约缺失原因':historical?'含历史行情估值；展开合约查看行情交易日和时刻':'L1 行情估值';
      }
      $('valuation-coverage').textContent=known?groups.filter(g=>valuation(g).amount!==null).length+' / '+groups.length:'--';
      const priced=groups.map(valuation).filter(v=>v.amount!==null), historical=priced.some(v=>v.historical);
      const quoteDays=[...new Set(groups.filter(g=>g.mark?.trading_day).map(g=>String(g.mark.trading_day)))].sort();
      $('quote-status').textContent=priced.length?(historical?'历史行情':'L1 行情')+(quoteDays.length?' · '+quoteDays.join(' / '):''):'';
      $('quote-status').className='quote-status'+(historical?' stale':'');
      $('quote-status').title=historical?'含快照、暂停、断线、停更或原生时间较旧的行情；展开合约查看具体时刻':'金额随 L1 行情更新';
      const captured=sources.map(s=>s.entry?.observed_us).filter(Boolean);
      $('updated').textContent=captured.length?'更新于 '+time(Math.min(...captured),true):'--';
      $('mode').textContent=sources.length && sources.every(s=>s.entry && !s.entry.can_trade)?'只读观察':'持仓观察';
      $('source-updates').innerHTML=sources.map(s=>{
        const entry=s.entry ?? s.saved_entry;
        const observation=entry ? `<span>${s.entry?'交易日':'快照交易日'} ${escape(entry.trading_day)}</span><time>${time(entry.observed_us)}</time>` : '';
        return `<div class="strategy-update"><span class="strategy-update-name">${adapterName(s)}</span>${badge(status(s))}${observation}</div>`;
      }).join('');
      const problems=sources.flatMap(s=>{
        const phase=status(s);
        if (phase.startsWith('waiting-') || ['restarting','recovering','observing'].includes(phase)) return [];
        const reason=s.entry?.reason==='runtime failed; complete recovery required before trading'
          ? '柜台进程已退出，恢复后需重新对账' : s.entry?.reason;
        return [s.error,reason,phase==='stale'?'持仓心跳过期，保留最后已知仓位':null].filter(Boolean).map(detail=>adapterName(s)+'：'+detail);
      });
      $('notice').hidden=!problems.length; $('notice').textContent=problems.join(' · '); $('notice').className='meta stale';
    }
    function renderPositions(sources, groups) {
      state.groups = groups;
      const observation=sources[0] && positionView(sources[0]), ready=observation?.position_ready;
      $('filtered-contracts').textContent = ready || groups.length ? fmt(groups.length) : '--';
      $('filtered-net-long').textContent = ready ? fmt(groups.filter(g=>g.long>g.short).length) : '--';
      $('filtered-net-short').textContent = ready ? fmt(groups.filter(g=>g.short>g.long).length) : '--';
      $('position-note').textContent = ready ? (observation.historical
        ? observation.label+' · '+time(observation.observed_us,true) : '') : "等待柜台持仓恢复";
      const strategyColumn = state.strategy ? '<th>净目标 · 手</th>' : '';
      const columns = state.strategy ? 6 : 5;
      $('position-head').innerHTML = `<tr><th>合约</th><th>柜台净仓 · 手</th>${strategyColumn}<th>净金额 · 元</th><th>状态</th><th>更新时间</th></tr>`;
      const content = groups.map((g,index) => {
        const open=detailOpen(g);
        const net=g.positionReady ? g.long-g.short : null;
        const target=g.attribution?.target_lots, phase=status(g.source);
        const targetCell=state.strategy ? `<td class="${qtyClass(target)}">${signed(target)}</td>` : '';
        let html = `<tr class="aggregate-row ${g.historical||phase!=='observing'?'retained':''}" data-symbol="${escape(g.symbol)}"><td><span class="group-label"><button class="group-toggle" data-group="${index}" aria-expanded="${open}" aria-label="${open?'收起':'展开'} ${escape(g.symbol)}"></button>${contractLabel(g)}</span></td><td class="${qtyClass(net)}">${signed(net)}</td>${targetCell}<td class="net-amount">${net===null?'--':amountCell(g)}</td><td>${badge(phase)}</td><td>${time(g.observedUs)}</td></tr>`;
        if (open) {
          const detail = g.attribution ? strategyDetails(g, phase==='observing' && !g.historical ? net : null) : state.strategy
            ? `<h3 class="strategy-heading">策略构成</h3><div class="position-detail strategy-message meta">${strategyMessage()}</div>` : '';
          const brokerOpen = state.brokerDetails.has(g.key);
          const broker = g.positions.length ? `<button type="button" class="broker-toggle" data-broker="${index}" aria-expanded="${brokerOpen}">柜台明细</button>${brokerOpen ? brokerDetails(g) : ''}` : '';
          html += `<tr class="detail-row"><td colspan="${columns}">${detail}${broker}</td></tr>`;
        }
        return html;
      }).join('');
      const empty = !sources.length ? "等待持仓数据" : !ready ? "等待柜台完成持仓恢复" : $('symbol').value ? "当前筛选没有持仓"
        : observation.historical ? "上次确认无持仓" : sources[0].adapter==='yida' && status(sources[0])!=='observing' ? "持仓数据未就绪，等待更新" : "当前无持仓";
      rows('positions',content,columns,empty);
    }
    function strategyDetails(g, brokerNet) {
      const {attributed_lots: attributed, strategies} = g.attribution;
      const visible = $('show-zero').checked ? strategies : strategies.filter(activeStrategy);
      const detail = [...visible].sort((a,b)=>Math.abs(b.attributed_lots)-Math.abs(a.attributed_lots) || a.name.localeCompare(b.name))
        .map(row => {
          const target = row.target_lots === row.attributed_lots ? ''
            : `<small class="strategy-target muted">目标 ${signed(row.target_lots)} 手</small>`;
          return `<tr><td>${escape(row.name)}</td><td><span class="${qtyClass(row.attributed_lots)}">${signed(row.attributed_lots)}</span>${target}</td></tr>`;
        }).join('');
      const difference = brokerNet === null || brokerNet === attributed ? '' : `<p class="attribution-gap">策略合计 ${signed(attributed)} 手，柜台与账本相差 ${signed(brokerNet-attributed)} 手</p>`;
      const table = detail ? `<div class="position-detail strategy-detail"><table aria-label="${escape(g.symbol)} 策略仓位"><thead><tr><th>策略</th><th>策略净仓 · 手</th></tr></thead><tbody>${detail}</tbody></table></div>`
        : '<div class="position-detail strategy-message meta">当前策略仓位和目标均为零</div>';
      return `<h3 class="strategy-heading">策略构成</h3>${table}${difference}`;
    }
    function brokerDetails(g) {
      const details = g.positions.map(p => {
        const v=p.position;
        return `<tr><td>${side(p.side)}</td><td>${fmt(v.today+v.yesterday)}</td><td>${fmt(v.today)}</td><td>${fmt(v.yesterday)}</td></tr>`;
      }).join('');
      const v=valuation(g), mark=g.mark;
      const basis=mark?`${mark.kind==='option'?'净权利金市值':'净名义金额'}＝净手数 × 合约乘数 ${fmt(mark.contract_multiple)} × ${v.priceLabel||'L1 估值价'} ${v.price==null?'--':escape(String(v.price))}；行情交易日／时刻 ${escape(v.quoteTime||String(mark.trading_day||'--')+' '+(mark.native_time||'--'))} · ${escape(v.reason)}${v.historical?' · 历史行情':''}。`:'等待合约元数据与 L1 行情';
      return `<div class="position-detail broker-detail"><div class="valuation-basis">${basis}</div><table aria-label="${escape(g.symbol)} 柜台持仓明细"><thead><tr><th>方向</th><th>持仓 · 手</th><th>今仓 · 手</th><th>昨仓 · 手</th></tr></thead><tbody>${details}</tbody></table></div>`;
    }

    function render() {
      const sources=selectedSources();
      selectStrategySource(sources[0]);
      const allGroups=positionGroups(sources,false), visible=positionGroups(sources);
      renderStrategyStatus(visible);
      renderFunds(sources[0]); renderOverview(sources,allGroups); renderPositions(sources,visible);
    }
    function accept(frame) {
      if (frame.type!=='cn_futures_state' || !frame.source_id) return;
      state.sources.set(frame.source_id,frame);
      render();
    }
    function connect() {
      clearTimeout(state.timer);
      if(state.ws){state.ws.onclose=null;state.ws.close();}
      connection('连接中','');
      const ws=state.ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+WS_PATH);
      ws.onopen=()=>connection('实时连接','ok');
      ws.onmessage=event=>{try{accept(JSON.parse(event.data));}catch(error){console.error(error);}};
      ws.onerror=()=>ws.close();
      ws.onclose=()=>{connection('重连中','err');state.timer=setTimeout(connect,2000);};
    }
    document.addEventListener('click',event=>{
      const sourceButton=event.target.closest('[data-source]');
      if(sourceButton){
        state.preferredSource=sourceButton.dataset.source;
        const url=new URL(location.href);
        url.searchParams.set('source',state.preferredSource);
        history.replaceState(null,'',url);
        render();
        return;
      }
      const broker=event.target.closest('[data-broker]');
      if (broker) {
        const key=state.groups[Number(broker.dataset.broker)]?.key;
        if (key) {
          state.brokerDetails.has(key) ? state.brokerDetails.delete(key) : state.brokerDetails.add(key);
          render();
        }
        return;
      }
      const button=event.target.closest('[data-group]');
      const group=state.groups[Number(button?.dataset.group)];
      if (!group) return;
      state.detailChoices.set(group.key, button.getAttribute('aria-expanded') !== 'true');
      render();
    });

    $('show-zero').onchange=render;$('symbol').oninput=render;
    $('refresh').onclick=()=>{connect();void loadStrategy();void loadObservation();};
    render();setInterval(render,1000);setInterval(loadStrategy,5000);setInterval(loadObservation,15000);connect();
  })();
  </script>
</body></html>
