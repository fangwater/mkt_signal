[package]
name = "usstock_replay"
version.workspace = true
edition.workspace = true

[[bin]]
name = "usstock_replay"
path = "src/main.rs"

[[bin]]
name = "usstock_l1_match_audit"
path = "src/bin/usstock_l1_match_audit.rs"

[[bin]]
name = "usstock_inference_samples"
path = "src/bin/usstock_inference_samples.rs"

[[bin]]
name = "usstock_backtest_1s"
path = "src/bin/usstock_backtest_1s.rs"

[[bin]]
name = "usstock_extract_normalised"
path = "src/bin/usstock_extract_normalised.rs"

[[bin]]
name = "usstock_export_quotes"
path = "src/bin/usstock_export_quotes.rs"

[[bin]]
name = "usstock_baseline_hfq_1min"
path = "src/bin/usstock_baseline_hfq_1min.rs"

[[bin]]
name = "usstock_features_1min_hfq"
path = "src/bin/usstock_features_1min_hfq.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.8"
clap = { version = "4.0", features = ["derive"] }
csv = "1.3"
flate2 = { version = "1.0", default-features = false, features = ["zlib-ng"] }
mkt_signal = { path = "../.." }
polars = { version = "0.43.1", default-features = false, features = ["parquet", "dtype-i8", "dtype-i16"] }
rayon = "1.10"
rocksdb = { version = "0.21", default-features = false, features = ["lz4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
