[package]
name = "usstock_replay"
version.workspace = true
edition.workspace = true

[[bin]]
name = "usstock_replay"
path = "src/main.rs"

[[bin]]
name = "usstock_l1_match_audit"
path = "src/bin/usstock_l1_match_audit.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.0", features = ["derive"] }
csv = "1.3"
flate2 = { version = "1.0", default-features = false, features = ["zlib-ng"] }
rocksdb = { version = "0.21", default-features = false, features = ["lz4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
