syntax = "proto3";
package cn_futures_target;

service PositionTargets {
  // One persistent stream. Receipts follow request order within the stream.
  rpc Push(stream PositionTarget) returns (stream TargetReceipt);
}

service ManagerPlans {
  rpc Watch(PlanSubscription) returns (stream PlanUpdate);
}

message PlanSubscription {
  string source_id = 1;
  bool observe_only = 2; // Request the current Manager target with no execution lease.
}

message PlanUpdate {
  // An absent target clears pending delivery. An admitted target keeps its lease.
  // Observational targets have expires_at_us=0 and may omit the native day.
  PositionTarget target = 1;
  PlanStatus status = 2;
  string batch_id = 3;
  int64 target_revision = 4;
}

enum PlanStatus {
  PLAN_STATUS_UNSPECIFIED = 0;
  PLAN_STATUS_READY = 1;
  PLAN_STATUS_NO_BATCH = 2;
  PLAN_STATUS_NO_EXTERNAL_DEMAND = 3;
  PLAN_STATUS_OBSERVE_ONLY = 4;
  PLAN_STATUS_MISSING_TRADING_DAY = 5;
  PLAN_STATUS_LEASE_EXPIRED = 6;
  PLAN_STATUS_DECISION_IN_FUTURE = 7;
  PLAN_STATUS_REPLICA_NOT_READY = 8;
  PLAN_STATUS_ACCOUNT_NOT_READY = 9;
  PLAN_STATUS_ACCOUNT_SNAPSHOT_STALE = 10;
  PLAN_STATUS_TRADING_DAY_MISMATCH = 11;
  PLAN_STATUS_ACCOUNT_POSITIONS_UNCONFIRMED = 12;
  PLAN_STATUS_EVIDENCE_ERROR = 13;
  PLAN_STATUS_REFRESHING = 14;
}

message PositionTarget {
  string source_id = 1;
  string batch_id = 2;
  int64 target_revision = 3;
  string trading_day = 4;
  uint64 expires_at_us = 5;
  repeated ContractTarget net_targets = 6;
  uint64 decision_us = 7; // Immutable creation time from the account target producer.
}

message ContractTarget {
  string market = 1; // Exchange and exact native delivery contract, e.g. SHFE:zn2701.
  sint32 lots = 2;
}

message TargetReceipt {
  string source_id = 1;
  string batch_id = 2;
  int64 target_revision = 3;
  Admission admission = 4;
  string reason = 5;
}

enum Admission {
  ADMISSION_UNSPECIFIED = 0;
  ADMISSION_ACCEPTED = 1; // Accepted by the Exec loop; no exchange acknowledgement is implied.
  ADMISSION_REJECTED = 2;
  ADMISSION_BUSY = 3;     // Queue full or request elapsed before confirmation.
}
