[package]
name = "viz_server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "cn-futures-viz"
path = "src/bin/cn_futures_viz.rs"

[dependencies]
anyhow.workspace = true
axum = { version = "0.7", features = ["ws"] }
bincode = "1.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.0", features = ["derive"] }
cn_futures_pbs = { path = "../cn_futures_pbs" }
cn_futures_state = { path = "../cn_futures_state" }
cn_market_proto.workspace = true
env_logger = "0.10"
futures-util = "0.3"
iceoryx2 = "0.8.1"
ipc_common = { path = "../ipc_common" }
log = "0.4"
order_common = { path = "../order_common" }
reqwest = { version = "0.12.19", default-features = false }
runtime_common = { path = "../runtime_common" }
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"
tonic = { version = "0.14", features = ["transport"] }
viz_common = { path = "../viz_common" }

[dev-dependencies]
tokio-tungstenite = "0.24"
