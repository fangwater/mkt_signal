[package]
name = "usstock_aggregate_baseline"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
polars = { version = "0.43.1", default-features = false, features = ["parquet", "dtype-i8", "dtype-i16"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
zstd = "0.13"
