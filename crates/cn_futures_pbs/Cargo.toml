[package]
name = "cn_futures_pbs"
version.workspace = true
edition.workspace = true

[features]
default = []
ctp-sdk = ["dep:cn_futures", "cn_futures/ctp-sdk"]

[[bin]]
name = "cn-futures-pbs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.0", features = ["derive"] }
cn_futures = { path = "../cn_futures", optional = true }
iceoryx2 = "0.8.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
zmq = "0.10"

[dev-dependencies]
serde_json.workspace = true
