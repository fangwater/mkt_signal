[package]
name = "cn_futures"
version.workspace = true
edition.workspace = true

[features]
default = []
ctp-sdk = ["dep:cc", "dep:chrono", "dep:reqwest"]
yida-sdk = ["dep:cc"]
latency-metrics = []

[dependencies]
cn_futures_state = { path = "../cn_futures_state" }
cn_futures_target = { path = "../cn_futures_target" }
persist_common = { path = "../persist_common" }
order_common = { path = "../order_common" }
anyhow.workspace = true
async_log = { path = "../async_log" }
log = "0.4"
bytemuck = { version = "1.23", features = ["derive", "min_const_generics"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"], optional = true }
reqwest = { version = "0.12.19", default-features = false, features = ["rustls-tls"], optional = true }
sha2 = "0.10"
crossbeam-channel = "0.5"
encoding_rs = "0.8"
serde = { version = "1.0", features = ["derive", "rc"] }
bincode = "1.3"
rocksdb = { version = "0.25", default-features = false, features = ["lz4"] }
iceoryx2 = "0.8.1"
serde_json.workspace = true
toml = "0.8"
smallvec = { version = "1.15", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
cc = { version = "1.2", optional = true }

[[bin]]
name = "ctp-trader"
path = "src/bin/ctp_trader.rs"

[[bin]]
name = "ctp-md"
path = "src/bin/ctp_md.rs"

[[bin]]
name = "yida-trader"
path = "src/bin/yida_trader.rs"

[[bench]]
name = "native_hot_path"
harness = false

[[bench]]
name = "native_pipeline"
harness = false
required-features = ["yida-sdk", "latency-metrics"]
