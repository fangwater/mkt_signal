[package]
name = "cme_tas_replay"
version.workspace = true
edition.workspace = true

[[bin]]
name = "cme_tas_replay"
path = "src/main.rs"

[[bin]]
name = "cme_tas_vs_summary"
path = "src/bin/cme_tas_vs_summary.rs"

[[bin]]
name = "cme_tas_synth_1min"
path = "src/bin/cme_tas_synth_1min.rs"

[[bin]]
name = "cme_tas_kll"
path = "src/bin/cme_tas_kll.rs"

[[bin]]
name = "cme_tas_backtest"
path = "src/bin/cme_tas_backtest.rs"

[[bin]]
name = "cme_tas_drop_special_1min"
path = "src/bin/cme_tas_drop_special_1min.rs"

[[bin]]
name = "cme_tas_settlement_scan"
path = "src/bin/cme_tas_settlement_scan.rs"

[dependencies]
anyhow = "1.0"
bytes = { version = "1.0", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
clap = { version = "4.0", features = ["derive"] }
crossbeam-channel = "0.5"
csv = "1.3"
env_logger = "0.10"
flate2 = { version = "1.0", default-features = false, features = ["zlib-ng"] }
log = "0.4"
mkt_parsers = { path = "../mkt_parsers" }
polars = { version = "0.43.1", default-features = false, features = ["parquet"] }
reqwest = { version = "0.12.19", features = ["blocking"] }
rocksdb = { version = "0.21", default-features = false, features = ["lz4"] }
rolling_common = { path = "../rolling_common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
