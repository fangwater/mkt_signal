[package]
name = "cme_tas_replay"
version.workspace = true
edition.workspace = true

[[bin]]
name = "cme_tas_replay"
path = "src/main.rs"

[[bin]]
name = "cme_tas_vs_summary"
path = "src/bin/cme_tas_vs_summary.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
clap = { version = "4.0", features = ["derive"] }
csv = "1.3"
env_logger = "0.10"
flate2 = { version = "1.0", default-features = false, features = ["zlib-ng"] }
log = "0.4"
rocksdb = { version = "0.21", default-features = false, features = ["lz4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
