[package]
name = "mkt_parsers"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
bytes = { version = "1.0", features = ["serde"] }
atoi_simd = "0.15.6"
fast-float = "0.2.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sonic-rs = "0.5.1"
symbol_utils = { path = "../symbol_utils" }
tokio = { version = "1.0", features = ["sync"] }
