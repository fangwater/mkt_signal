[package]
name = "usstock_lseg_rawll2_replay"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
flate2 = "1.0"
rocksdb = { version = "0.21", default-features = false, features = ["lz4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
