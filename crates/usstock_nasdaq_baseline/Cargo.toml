[package]
name = "usstock_nasdaq_baseline"
version.workspace = true
edition.workspace = true

[dependencies]
ahash.workspace = true
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
flate2 = { version = "1.0", default-features = false, features = ["zlib-ng"] }
polars = { version = "0.43.1", default-features = false, features = ["parquet", "dtype-i8", "dtype-i16"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
