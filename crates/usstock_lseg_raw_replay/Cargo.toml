[package]
name = "usstock_lseg_raw_replay"
version.workspace = true
edition.workspace = true

[[bin]]
name = "usstock_lseg_raw_replay"
path = "src/main.rs"

[[bin]]
name = "usstock_lseg_raw_rocksdb"
path = "src/bin/usstock_lseg_raw_rocksdb.rs"

[[bin]]
name = "usstock_lseg_raw_verify"
path = "src/bin/usstock_lseg_raw_verify.rs"

[[bin]]
name = "usstock_lseg_raw_schema"
path = "src/bin/usstock_lseg_raw_schema.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
csv = "1.3"
env_logger = "0.11"
flate2 = "1.0"
fs2 = "0.4"
log = "0.4"
rayon = "1.10"
rocksdb = { version = "0.21", default-features = false, features = ["lz4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
