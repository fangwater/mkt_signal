[package]
name = "runtime_common"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4.0", features = ["derive"] }
libc = "0.2"
log = "0.4"
order_common = { path = "../order_common" }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
