# Include inside the existing 4191 server block. The monitor stays loopback-only.
# Reuse NAV's DB-backed administrator session for this standalone dashboard.
location = /fr-monitor {
    return 301 /fr-monitor/;
}

location = /fr-monitor-auth {
    internal;
    proxy_pass http://127.0.0.1:4200/api/admin/users;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

location /fr-monitor/ {
    auth_request /fr-monitor-auth;
    proxy_pass http://127.0.0.1:18180/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 1s;
    proxy_read_timeout 10s;
}
