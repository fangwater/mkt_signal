# Standalone public bridge config (HK side).
#
# Responsibilities:
# - Ingest JP public model output over the shared ZMQ port.
# - Relay the locally-republished model output to SG.
#
# Notes:
# - OKEX/Bybit market data consumers subscribe directly to spread_pbs/dat_pbs.
# - This config is intentionally public/global only; it does not use IPC_NAMESPACE.
# - Cross-host route ids must exactly match the JP/SG public bridge configs.

routes:
  # JP -> HK public model ingest.
  - id: public_binance_futures_direction_model_output
    from:
      type: zmq
      endpoint: "tcp://0.0.0.0:6360"
      size: 2048
    to:
      type: ipc
      endpoint: "model_output/binance_futures_direction_model"
      size: 2048
      max_publishers: 1
      max_subscribers: 10
      history_size: 128
      subscriber_max_buffer_size: 256

  # HK -> SG relay: subscribe to locally-republished JP model_output, PUSH to SG.
  - id: public_binance_futures_direction_model_output_sg
    from:
      type: ipc
      endpoint: "model_output/binance_futures_direction_model"
      size: 2048
    to:
      type: zmq
      endpoint: "tcp://47.131.162.78:6360"
      size: 2048
