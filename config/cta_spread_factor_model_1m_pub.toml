[universe]
# Spread signal factors only. Execution Vol includes every symbol in each Kafka market.
symbols = ["AXSUSDT", "BELUSDT", "DASHUSDT", "ENJUSDT", "IOSTUSDT", "IOTAUSDT", "KAVAUSDT", "NEARUSDT", "ONTUSDT", "QTUMUSDT", "RUNEUSDT", "SKLUSDT", "SOLUSDT", "TRBUSDT", "VETUSDT", "ZENUSDT", "ZRXUSDT"]
factors = ["TD_PR_011", "TD_TI_024", "baseline_005", "baseline_028", "baseline_105", "baseline_140", "baseline_164"]

[tlen_server]
base_url = "http://127.0.0.1:6322"
request_timeout_ms = 5000
symbol_reload_secs = 180

# Keep this identical to the V005/rx01 offline normalize_factors contract.
[normalize]
window_bars = 1440
min_periods = 1000
clip_zscore = 3.0

[kafka]
lookback_secs = 259200
catchup_timeout_secs = 5400
topic = "binance-futures"
cash_topic = "binance-spot"
topics = ["binance-futures", "binance-spot"]
brokers = "156.231.137.189:1501"
group_id = "cta_spread_factor_model_1m"
client_id = "cta_spread_factor_model_1m"
offset_reset = "earliest"
payload_compression = "zlib"
poll_timeout_ms = 1000
enable_auto_commit = false
enable_partition_eof = false
security_protocol = "none"
broker_addr_rewrites = [
  { from_host = "10.140.140.55", to_host = "156.231.137.189" },
]
