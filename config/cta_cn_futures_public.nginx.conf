# Prep configuration panel; API writes require the worker's panel credential.
# One worker per CTA instance; each reverse tunnel ends on the cloud loopback port below.
# Adding an instance: extend this map and instances.json.
map $cta_instance $cta_upstream {
    default "";
    01 127.0.0.1:19401;
    02 127.0.0.1:19402;
}
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Browsers keep the #access fragment across this redirect; the old link was instance 01.
    location ~ ^/(cta-cn-futures/?)?$ {
        return 302 /cta-cn-futures/01/$is_args$args;
    }
    # Instance switcher list for the page.
    location = /cta-cn-futures/instances.json {
        default_type application/json;
        return 200 '["01","02"]';
    }
    location ~ ^/cta-cn-futures/(?<cta_instance>[0-9]{2})(?<cta_rest>/products/[a-z0-9]+)?$ {
        if ($cta_upstream = "") { return 404; }
        return 308 /cta-cn-futures/$cta_instance$cta_rest/$is_args$args;
    }
    location ~ ^/cta-cn-futures/(?<cta_instance>[0-9]{2})/(?<cta_path>(?:products/[a-z0-9]+/)?(?:api/products)?)$ {
        if ($cta_upstream = "") { return 404; }
        limit_except GET { deny all; }
        proxy_pass http://$cta_upstream/$cta_path;
        proxy_connect_timeout 2s;
    }
    location ~ ^/cta-cn-futures/(?<cta_instance>[0-9]{2})/(?<cta_path>(?:products/[a-z0-9]+/)?api/config)$ {
        if ($cta_upstream = "") { return 404; }
        limit_except GET POST { deny all; }
        proxy_pass http://$cta_upstream/$cta_path$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 65s;
        proxy_buffering off;
    }
    location ~ ^/cta-cn-futures/(?<cta_instance>[0-9]{2})/(?<cta_path>(?:products/[a-z0-9]+/)?api/preview)$ {
        if ($cta_upstream = "") { return 404; }
        limit_except POST { deny all; }
        proxy_pass http://$cta_upstream/$cta_path$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 65s;
        proxy_buffering off;
    }
    location / { return 404; }
    include /etc/nginx/snippets/cn-futures-manager.conf;
}
