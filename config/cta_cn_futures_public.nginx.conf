# Prep configuration panel; API writes require the worker's panel credential.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = / {
        return 302 /cta-cn-futures/$is_args$args;
    }
    location = /cta-cn-futures {
        return 308 /cta-cn-futures/$is_args$args;
    }
    location = /cta-cn-futures/ {
        proxy_pass http://127.0.0.1:19401/;
        limit_except GET { deny all; }
    }
    location = /cta-cn-futures/api/config {
        proxy_pass http://127.0.0.1:19401/api/config;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 65s;
        proxy_buffering off;
        limit_except GET POST { deny all; }
    }
    location = /cta-cn-futures/api/preview {
        proxy_pass http://127.0.0.1:19401/api/preview;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 65s;
        proxy_buffering off;
        limit_except POST { deny all; }
    }
    location / { return 404; }
}
