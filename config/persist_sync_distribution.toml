# Global persist_manager gRPC sync source distribution table.
#
# Public endpoints stay inside 6300-6400. The 30 public ports reserved for
# persist sync are: 6340-6359 and 6380-6389.
#
# Only sources explicitly requested by the operator are allocated here. Scripts
# must fail closed for envs that are not listed.

[strategy]
public_range = "6300-6400"
reserved_public_ports = "6340-6359,6380-6389"
reserved_public_port_count = 30
protocol = "plaintext gRPC over HTTP/2"
source_id_rule = "env directory basename unless an allocation explicitly says otherwise"
bind_rule = "127.0.0.1:(50000 + public_port - 6300)"
nginx_mapping_rule = "local public_url sources use 127.0.0.1:<public_port> <bind_host>:<bind_port>; remote-public sources use <public_port> <bind_host>:<bind_port>"
fail_closed = true
notes = [
  "Bybit intra arb01 is fixed on SG 6351 and should not be moved.",
  "Local arb01 sources on this machine use 127.0.0.1 with fixed ports 6342-6345.",
  "Unmentioned strategies/envs must not receive concrete allocations.",
]

[regions.jp]
host = "54.64.147.69"
base_url = "http://54.64.147.69"

[regions.hk]
host = "47.238.128.48"
base_url = "http://47.238.128.48"

[regions.sg]
host = "47.131.162.78"
base_url = "http://47.131.162.78"

# Local intra/cross arb01 sources on this machine.
[[allocations]]
port = 6342
region = "local"
strategy = "intra"
env = "binance-intra-arb01"
source_id = "binance-intra-arb01"
public_url = "http://127.0.0.1:6342"
bind = "127.0.0.1:50042"
status = "fixed"

