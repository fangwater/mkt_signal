# period_pbs config.
# Fixed in code:
# - service_root = "dat_pbs"
# - period_ms = 3000

# Canonical symbols used inside emitted PeriodMessage payloads.
# Per-venue source symbols are mapped back to these names before collection.
online_symbols = [
  "BTCUSDT",
  "ETHUSDT",
  "SOLUSDT",
  "XRPUSDT",
  "DOGEUSDT",
  "1000PEPEUSDT",
  "BNBUSDT",
  "SUIUSDT",
  "ADAUSDT",
  "LINKUSDT",
  "AVAXUSDT",
  "1000SHIBUSDT",
  "LTCUSDT",
  "BCHUSDT",
  "NEARUSDT",
  "DOTUSDT",
  "XLMUSDT",
  "AAVEUSDT",
  "HBARUSDT",
  "UNIUSDT",
  "ATOMUSDT",
  "TRXUSDT",
]

[zmq]
# Supports both tcp:// and ipc:// PUB binds.
bind = "tcp://0.0.0.0:16380"
sndhwm = 10000
linger_ms = 0
send_dontwait = true

[[venues]]
name = "binance-margin"
topic = "binance-spot"
poll_batch = 65536
idle_sleep_us = 0
delay_ms = 5

# Canonical online symbol -> source symbol observed on this venue.
# Binance spot/margin does not use futures quantity-prefix contract symbols.
[venues.symbol_map]
"1000PEPEUSDT" = "PEPEUSDT"
"1000SHIBUSDT" = "SHIBUSDT"

[[venues]]
name = "binance-futures"
topic = "binance-futures"
poll_batch = 65536
idle_sleep_us = 0
delay_ms = 5
