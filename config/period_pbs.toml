# period_pbs config.
# Fixed in code:
# - service_root = "dat_pbs"
# - period_ms = 3000

# Optional process CPU affinity. Set before subscribing/publishing so worker
# threads inherit the same affinity.
core = 21

# Canonical symbols used inside emitted PeriodMessage payloads. Quantity-prefix
# contract symbols such as 1000PEPEUSDT are normalized to PEPEUSDT.
online_symbols = [
  "BTCUSDT",
  "ETHUSDT",
  "SOLUSDT",
  "XRPUSDT",
  "DOGEUSDT",
  "PEPEUSDT",
  "BNBUSDT",
  "SUIUSDT",
  "ADAUSDT",
  "LINKUSDT",
  "AVAXUSDT",
  "SHIBUSDT",
  "LTCUSDT",
  "BCHUSDT",
  "NEARUSDT",
  "DOTUSDT",
  "XLMUSDT",
  "AAVEUSDT",
  "HBARUSDT",
  "UNIUSDT",
  "ATOMUSDT",
  "TRXUSDT",
]

[zmq]
# Supports both tcp:// and ipc:// PUB binds.
bind = "tcp://0.0.0.0:16380"
sndhwm = 10000
linger_ms = 0
send_dontwait = true

[[venues]]
name = "binance-margin"
topic = "binance-spot"
poll_batch = 65536
idle_sleep_us = 0
delay_ms = 5

[[venues]]
name = "binance-futures"
topic = "binance-futures"
poll_batch = 65536
idle_sleep_us = 0
delay_ms = 5
