[universe]
symbols = ["BANDUSDT", "BELUSDT", "DASHUSDT", "DOGEUSDT", "DOTUSDT", "ETCUSDT", "IOTAUSDT", "NEARUSDT", "RUNEUSDT", "SKLUSDT", "SOLUSDT", "VETUSDT", "XLMUSDT", "YFIUSDT", "ZENUSDT"]
