# 1-minute model publisher configuration.
# This process reads factor_plan_1m and subscribes to fusion_factor_1m.
model_manager_base_url = "http://127.0.0.1:6300"
model_manager_request_timeout_ms = 120000
tlen_server_base_url = "http://127.0.0.1:6322"
tlen_server_request_timeout_ms = 5000

# Fill in complete service names. Deployment rewrites output_service for --target.
input_service = "fusion_factor_1m/binance-futures"
output_service = "model_output/binance-futures-mid-re-1m"

[score_rolling]
params_hash_key_template = "model_score_rolling_params_{model_name}"
output_hash_key_template = "model_score_rolling_thresholds_{model_name}"
reload_param_sec = 60
max_length = 150000
rolling_window = 14400
min_periods = 10000
quantiles = [0.9, 0.8, 0.2, 0.1]
