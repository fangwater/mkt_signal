# SDK-free, read-only account monitoring. No database or trading credentials.
stale_after_ms = 15000
# manager_port = 18211  # existing loopback Manager gateway
# l1 = { zmq_port = 13005, metadata_port = 18312 }  # loopback market tunnels for CTP

[http]
bind = "127.0.0.1"
port = 8811
ws_path = "/ws"

# account is a display alias; never put a native investor ID or credentials here.
# namespace and hash must match the running trader's position_ipc / identity.
[[counters]]
id = "yida-sim"
label = "易达仿真柜台"
account = "simulation-observe"
adapter = "yida"
position_namespace = "cn_yida_sim"
expected_account_hash = "<64-character account hash>"

