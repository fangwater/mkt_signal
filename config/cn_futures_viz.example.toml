# SDK-free, read-only domestic futures dashboard. No trading/front credentials.
# Copy to config/cn_futures_viz.toml and select the sources on the Viz host.
poll_interval_ms = 1000
stale_after_ms = 15000
row_limit = 200

[http]
bind = "127.0.0.1"
port = 8811
ws_path = "/ws"

# This is the company-intranet Tonglian relay, not a public or colo feed.
# Start cn-futures-pbs independently with the matching service_root.
[[market_data]]
id = "company-intranet"
label = "公司内网 · 通联期货 L2"
environment = "company_intranet"
service_root = "cn_futures_pbs/company_intranet"
venues = ["CFFEX", "SHFE", "INE", "CZCE", "DCE", "GFEX"]
symbols = []
max_symbols = 2000
stale_after_ms = 15000

# Configure the existing normalized execution RocksDB, not the SDK flow files.
# All paths must be absolute. Each secondary must be outside every primary
# and outside other secondary directories. Never share a secondary with Manager.
# account is a display alias; do not put credentials/native investor IDs here.
# expected_account_hash can pin cn_trading_meta/identity.account_hash (optional).
