    location = /cta/binance-cta-perp-rx01 {
        return 302 /cta/binance-cta-perp-rx01/$is_args$args;
    }

    # Configuration redirects are owned by cta_factor_config.conf.

    location /cta/binance-cta-perp-rx01/ {
        auth_request /manager-auth/exec_trade06;
        proxy_pass http://127.0.0.1:10195/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }
