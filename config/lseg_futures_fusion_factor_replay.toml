# Offline LSEG/CME 1-minute fusion-factor replay.
#
# The trade input is the TAS-derived standard 1-minute baseline. The depth
# input is the matching LSEG Normalized LL2 derived 1-second, native 10-level
# book. Both inputs use fixed-expiry contract_id sequences.
feature_set = "lseg_futures_1m"
trade_root = "/mnt/hdd-raid5-72t/liang_torch/lseg_data/baseline_data_1m_drop_special"
depth_root = "/mnt/hdd-raid5-72t/liang_torch/lseg_data/level2_1s"
output_root = "/mnt/hdd-raid5-72t/liang_torch/lseg_data/fusion_factor_1m"

# Dates name Chicago 17:00 trading-day parquet files. Keep this template to a
# small dry-run sample; expand deliberately for a full offline build.
start_date = "2024-01-09"
end_date = "2024-01-09"
products = ["CME/ES"]
contracts = ["CME:ES:2024-03"]

# Expands to every implemented fusion formula. Formulas that nominally use 15
# or 20 levels adapt their aggregation window to LSEG's native ten levels.
# Warming-up or source-missing results remain parquet null, never zero-filled.
factors = ["lseg_futures_all"]
replay_workers = 8

overwrite = false
dry_run = true
