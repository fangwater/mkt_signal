# Official CTP 6.7.11; all paths are examples. Keep SDK files outside the repository.
# Supply real front/BrokerID locally. Never commit credentials or copy env.sh values here.
sdk_library = "/opt/ctp/6.7.11/libthosttraderapi_se.so"
flow_directory = "/tmp/mkt_ctp_sim/flow"
journal = "/tmp/mkt_ctp_sim/events.jsonl"
# persistence_directory defaults to flow_directory/persist_manager; one account/adapter/front per store.
sync_before_send = false # true: wait for synced RocksDB intent before calling the SDK
front = "tcp://127.0.0.1:1"
broker_id = "REPLACE"
# CTP 6.7.11 factory option: false selects the evaluation API, true the production API.
# Confirm the required mode with the front provider; this flag alone does not prove a front is simulated.
production_mode = false
user_id_env = "CTP_USER_ID"
password_env = "CTP_PASSWORD"
app_id_env = "CTP_APP_ID"
auth_code_env = "CTP_AUTH_CODE"
require_authentication = true
# investor_id_env = "CTP_INVESTOR_ID" # Optional when InvestorID is the same as UserID.
event_capacity = 8192
query_interval_ms = 1100
response_timeout_ms = 30000
# 0 = busy polling. Choose/pin CPU after measuring on the actual execution machine.
idle_sleep_us = 50

[[symbols]]
# Replace with a currently listed, authorized CFFEX contract before connecting.
symbol = "IF2612"
# Explicit conservative local budget, not an exchange-quoted margin requirement.
# Choose from the actual broker requirements plus fees/buffer; do not treat this sample as current metadata.
cash_budget_per_open_lot = 250000.0

[risk]
max_order_lots = 1
max_position_lots_per_side = 2
max_working_lots = 2
max_actions_per_second = 2
minimum_cash_remaining = 10000.0
enable_fak_fok = false
# Verify the CFFEX Close allocation with the actual broker during simulation.
close_priority = "today_first"
