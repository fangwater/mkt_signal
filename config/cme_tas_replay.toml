# One process, one live RocksDB. All listed periods share one worker pool.
# Unhandled rows are dumped and skipped; they do not abort the run.
# A period already marked done / writing is still refused.
data_root = "/mnt/hdd-raid5-72t/liang_torch/lseg_data/future/normalised"
period = "2026-01-01_2026-06-01"
periods = [
    "2024-01-01_2025-01-01",
    "2025-01-01_2026-01-01",
    "2026-01-01_2026-06-01",
]
rocksdb_dir = "/mnt/nvme-raid0-28t/fanghaizhou/lseg_data/cme_tas_rocksdb"

# Optional extra exact-#RIC allowlist on top of the built-in 51 product roots.
# Empty = write every RIC that matches a research root (e.g. ADF26, CLG24).
# Index / NGLND* / LCO* / unmapped roots are skipped, not written.
rics = []

# workers > 1: every gzip part of every period, this many at a time.
# workers = 1: only part_index of the first period.
# 32 parts across 2024/2025/2026 H1; one worker per part. Do not start a second process on this dir.
workers = 32
part_index = 0

# Shared 294-column catalog. Unknown header names still fail at start.
column_rules = "../preprocess/lseg/tas_column_rules.json"

# 0 = no session cap. Do not use a per-worker tradeday window on a full run.
max_tradedays = 0

# Diagnostic cap. Omit for the whole first gzip.
# max_source_rows = 20000

# Heartbeat every N source rows. 0 turns it off.
progress_every = 1000000

# Always on. Appends info/error here.
log_path = "/mnt/nvme-raid0-28t/fanghaizhou/lseg_data/logs/cme_tas_replay.log"

# Unhandled rows (unknown Type / unexpected column / bad number). One line each.
unparsed_path = "/mnt/nvme-raid0-28t/fanghaizhou/lseg_data/logs/cme_tas_replay_unparsed.log"
