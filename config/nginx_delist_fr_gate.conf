# Include in every protected FR location, including APIs and websocket paths.
set $delist_original_uri $uri;
set $delist_original_method $request_method;
auth_request /delist-fr-auth;
auth_request_set $parameter_actor $upstream_http_x_parameter_actor;
proxy_set_header X-Parameter-Actor $parameter_actor;
error_page 401 = @delist_entry;
add_header Cache-Control "no-store" always;
add_header X-Frame-Options "DENY" always;
