# Tardis replay root contains trades/ and incremental_book_L2/ directly; do not
# point it at the TardisSource parent. data_dir is a legacy fallback for every
# symbol. Use symbol_data_dirs when each symbol has its own source root.
#
# USD-M futures source directories use a binance-futures file prefix and map to
# venue = "binance-futures". The active range below is 2024-12-01..2024-12-31.
#
# Spot replay is config/tardis_replay_binance_spot.toml. Tardis files use the
# `binance_*` prefix and ClickHouse tables use SID 6 slug `binance`.
# data_dir = "/mnt/Data/tardis/binance-futures"
venue = "binance-futures"
symbols = ["XRPUSDT", "DOGEUSDT", "SOLUSDT", "ETHUSDT", "BTCUSDT", "BNBUSDT"]

# Bounds are inclusive and required. Missing files before the first available
# day are skipped; a hole after that day through end_date is an error.
start_date = "2024-12-01"
end_date = "2024-12-31"

# Each worker owns one symbol's continuous trade stream and daily L2 sequence.
# One pass writes 1s backtest, ylabel, 5s/10s/1m trade baseline, 5s orderbook,
# and hourly notional KLL. Trade-baseline large/medium/small stay 0 until
# order_size.enabled=true and the previous month's KLL is complete.
replay_workers = 6
# This replay writes ClickHouse staging tables only. IPC publication is handled
# by a separate future publisher.
publish_ipc = false
# Persist hourly trade-notional KLL sketches beside the trade/depth staging data.
write_hourly_notional_kll = true
# When true, skip all baseline and L2 work and only write hourly KLL rows.
kll_only = false
# When true, rebuild only 5s/10s/60s trade baseline rows. KLL and depth rows are preserved.
order_size_only = false
# When true, skip 5s/10s/60s/KLL/ylabel staging and only write 1s CTA market bars
# to ClickHouse. Daily HDF is only an export of those rows.
# Leave this false to write 1s in the same pass as baseline, ylabel, and KLL.
market_1s_only = false
# Rerunning this date/symbol selection first synchronously deletes matching rows
# from the 1s/10s/1m trade tables, 5s depth, ylabel tables, and hourly KLL table,
# then writes a fresh result.
overwrite_existing = true

# Enable after the previous natural month's hourly KLL rows have been written.
# Each target month loads the previous natural month's KLL. Each raw trade is
# classified by price * amount before the existing 5s and 60s aggregation.
[order_size]
enabled = false
medium_quantile = 0.5
large_quantile = 0.9

# 1s CTA market bars written to ClickHouse in the same replay as 5s/60s
# trade/depth and hourly KLL. Daily HDF is only an export of those rows.
# Bid/ask0 come from the reconstructed L2 book, not last trade. Existing
# ClickHouse days are overwritten only when overwrite_existing=true.
[market_1s]
enabled = true
output_dir = "/mnt/hdd-raid5-72t/liang_torch/crypto_data/cta_backtest_data/binanceswap/tardis_agg_1s_daily"
file_sids = "1_6"
python = "/home/u171/venvs/jupyter312/bin/python"
write_clickhouse = true
write_hdf = true

[symbol_data_dirs]
XRPUSDT = "/mnt/30.133_xintang/Data/Crypto/TardisSource/binance_usd_xrpusdt"
DOGEUSDT = "/mnt/30.133_xintang/Data/Crypto/TardisSource/binance_usd_dogeusdt"
SOLUSDT = "/mnt/30.133_xintang/Data/Crypto/TardisSource/binance_usd_solusdt"
ETHUSDT = "/mnt/30.133_xintang/Data/Crypto/TardisSource/binance_usd_ethusdt"
BTCUSDT = "/mnt/30.133_xintang/Data/Crypto/TardisSource/binance_usd_btcusdt"
BNBUSDT = "/mnt/30.133_xintang/Data/Crypto/TardisSource/binance_usd_bnbusdt"

# Trade and L2 depth are replayed independently into append-only staging tables.
[clickhouse]
url = "http://127.0.0.1:18123"
database = "baseline"
batch_rows = 10000
flush_ms = 1000
queue_capacity = 100000
