# Live comparison between local IPC period cutting and Kafka PeriodMessage.

service_root = "dat_pbs"
period_ms = 3000
delay_ms = 5
poll_batch = 65536
idle_sleep_us = 0
compare_periods = 10
max_wait_secs = 90
skip_initial_matches = 1
dump_extra_limit = 32

compare_symbols = ["BTCUSDT"]

streams = [
  { venue = "binance-futures", topic = "binance-futures" },
  { venue = "binance-margin", topic = "binance-spot" },
]

[kafka]
brokers = "156.231.137.189:1501"
group_id = "period_pbs_live_compare"
client_id = "period_pbs_live_compare"
offset_reset = "latest"
payload_compression = "zlib" # auto | zlib | snappy | none
poll_timeout_ms = 0

enable_auto_commit = false
enable_partition_eof = false
security_protocol = "none"
sasl_mechanisms = "PLAIN"
sasl_username = "eladmin"
sasl_password = "eladmin"

max_partition_fetch_bytes = 10485760
fetch_max_bytes = 10485760
fetch_wait_max_ms = 100
socket_receive_buffer_bytes = 52428800
receive_message_max_bytes = 10486272
session_timeout_ms = 60000
heartbeat_interval_ms = 3000
max_poll_interval_ms = 300000

broker_addr_rewrites = [
  { from_host = "10.140.140.55", to_host = "156.231.137.189" },
]
