# Include inside the existing :4191 server. Backend is loopback-only.
location = /delist {
    return 302 /delist/;
}

# Only the internal subrequest may supply original-request security headers.
location = /delist/auth/verify {
    return 404;
}

location = /delist-fr-auth {
    internal;
    proxy_pass http://127.0.0.1:8787/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Original-URI $delist_original_uri;
    proxy_set_header X-Original-Method $delist_original_method;
    proxy_set_header X-Original-Upgrade $http_upgrade;
    proxy_set_header X-Original-Remote-Addr $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}

location @delist_entry {
    add_header Cache-Control "no-store" always;
    return 302 /delist/;
}
