# Raw 1-minute notebook factors exposed as one ModelMsg stream per factor.
# score = raw factor value; decision thresholds are exact rolling q90/q10.
[tlen_server]
# The deployed JP environment reaches its host-local TLen service through this loopback URL.
base_url = "http://127.0.0.1:6322"
request_timeout_ms = 5000
symbol_reload_secs = 180

[percentile]
window_size = 2880
min_samples = 1440

# The two inputs for this 1m publisher. At startup it replays retained
# PeriodMessage records, joins futures factors with spot NQ by symbol/bar,
# publishes ModelMsg records, then keeps consuming both Kafka streams. It never
# subscribes to current IPC trade-flow.
[kafka]
lookback_secs = 259200
catchup_timeout_secs = 1800
factor_topic = "binance-futures"
nq_topic = "binance-spot"
topics = ["binance-futures", "binance-spot"]
brokers = "156.231.137.189:1501"
group_id = "intra_factor_model_1m"
client_id = "intra_factor_model_1m"
offset_reset = "earliest"
payload_compression = "zlib"
poll_timeout_ms = 1000
enable_auto_commit = false
enable_partition_eof = false
security_protocol = "none"
broker_addr_rewrites = [
  { from_host = "10.140.140.55", to_host = "156.231.137.189" },
]
