# Trade flow feature 发布配置（基于 trade 聚合 bar + Redis 金额阈值）

trade_flow_feature_pub:
  data_source:
    # 从 depth_pubs 订阅盘口快照，追加到 trade_flow_feature 尾部
    depth_channel: "depth25"

  runtime:
    bar_ms: 5000
    # 从已关闭的基础 bar 聚合并发布独立 1min bar
    enable_1m_bar: true
    # 3分钟热更新一次 amount 阈值
    threshold_reload_secs: 180

  rl_factor:
    pct_change_period: 12
    rolling_window: 30
    scale_factor: 1.3
