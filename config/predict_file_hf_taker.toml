instance = "hf_taker"
out_dir = "predict_file"
flush_every = 512
flush_interval_ms = 1000
poll_interval_ms = 5
max_drain_per_source = 256
stats_secs = 30
cache_minutes = 30
cache_cleanup_ms = 30000
http_bind = "127.0.0.1"
http_port = 8818
pm2_namespace = "predict_file"
pm2_name = "predict_file-hf_taker"
rust_log = "info"

[[models]]
model_name = "binance-futures-mid-re-1m"
source = "ipc"
service = "model_output/binance-futures-mid-re-1m"
interval_ms = 1000
max_subscribers = 10
