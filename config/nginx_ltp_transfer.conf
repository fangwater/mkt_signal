# Include inside the existing Delist :4191 server. No new public listener.
location = /delist/transfers { return 303 /delist/transfers/; }
location ^~ /delist/transfers/ {
    set $ltp_transfer_original_method $request_method;
    set $ltp_transfer_expected_origin "$scheme://$http_host";
    set $ltp_transfer_request_origin $http_origin;
    if ($request_method ~ ^(GET|HEAD)$) {
        set $ltp_transfer_request_origin $ltp_transfer_expected_origin;
    }
    if ($ltp_transfer_request_origin != $ltp_transfer_expected_origin) { return 403; }
    auth_request /delist-transfer-auth;
    proxy_pass http://127.0.0.1:8788/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Parameter-Actor "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 90s;
    proxy_next_upstream off;
    client_max_body_size 16k;
    add_header Cache-Control "no-store" always;
}
location = /delist-transfer-auth {
    internal;
    proxy_pass http://127.0.0.1:8787/auth/verify-login;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Original-Method $ltp_transfer_original_method;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}
